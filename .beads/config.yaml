# Database backend configuration
database: dolt

# Dolt-specific settings
dolt:
  # Use Dolt in remote mode so hooks do not require a local Dolt server.
  # Valid values: server | remote
  mode: remote
  # When running in remote mode, server-specific connection settings are
  # ignored. The remote repository is defined below under `remote.url`.

# Sync mode (dolt-native keeps Dolt as source-of-truth with JSONL export)
sync:
  mode: dolt-native

# Enforced DoltHub remote for shared Beads state.
# Branches MUST use this remote configuration.
remote:
  name: dolthub
  # Use DoltHub remote (explicit repo and casing per task)
  url: https://doltremote.dolthub.com/r/rudironsoni/Ghost

sync-branch: "beads-sync"

# Federation configuration
federation:
  enabled: false
  peers: []
