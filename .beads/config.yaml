# Database backend configuration
database: dolt

# Dolt-specific settings
dolt:
  mode: remote
  host: 127.0.0.1
  port: 3307
  database: beads_Ghost

# Sync mode
sync:
  mode: dolt-native

# Enforced DoltHub remote for shared Beads state.
remote:
  name: dolthub
  url: rudironsoni/Ghost

sync-branch: "beads-sync"

federation:
  enabled: false
  peers: []
