# Database backend configuration
database: dolt

# Dolt-specific settings
dolt:
  mode: server
  host: 127.0.0.1
  port: 3307
  user: root
  db: beads_Ghost

# Sync mode (belt-and-suspenders = Dolt + JSONL)
sync:
  mode: belt-and-suspenders

# Enforced DoltHub remote for shared Beads state.
# Branches MUST use this remote configuration.
remote:
  name: dolthub
  url: https://doltremoteapi.dolthub.com/rudironsoni/ghost

sync-branch: "beads-sync"

# Federation configuration
federation:
  enabled: false
  peers: []
