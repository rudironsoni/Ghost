# Database backend configuration
database: dolt

# Dolt-specific settings
dolt:
  # Use Dolt in remote mode to connect directly to DoltHub.
  mode: remote
  # Local server connection details (not used in remote mode)
  # host: 127.0.0.1
  # port: 13929

# Sync mode (dolt-native keeps Dolt as source-of-truth with JSONL export)
sync:
  mode: dolt-native

# Enforced DoltHub remote for shared Beads state.
remote:
  name: dolthub
  url: rudironsoni/Ghost

sync-branch: "beads-sync"

federation:
  enabled: false
  peers: []
