# Nginx Canary Deployment Configuration
# Implements 90/10 traffic split between stable and canary versions
# with health checks, proper headers, and logging

# Upstream servers for stable and canary deployments
upstream ghost_stable {
    least_conn;
    server ghost-stable:5000 weight=90 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream ghost_canary {
    least_conn;
    server ghost-canary:5001 weight=10 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Log format with canary tracking
log_format canary_log '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'canary=$upstream_server';

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;

# Map for cookie-based sticky sessions
map $cookie_canary_session $upstream_pool {
    default "stable";
    "canary" "canary";
}

# Split clients for percentage-based traffic routing
split_clients "${remote_addr}${msec}" $canary_backend {
    90% ghost_stable;
    10% ghost_canary;
}

# Main server block
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Buffer settings for optimal performance
    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # Timeouts
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Logging
    access_log /var/log/nginx/access.log canary_log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health check endpoint - used by Docker health checks and load balancers
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Main proxy location with traffic splitting
    location / {
        # Rate limiting
        limit_req zone=general burst=200 nodelay;

        # Determine backend based on traffic splitting
        set $backend_pool $canary_backend;

        # Allow cookie-based override for testing
        if ($cookie_canary_session = "canary") {
            set $backend_pool "ghost_canary";
        }
        if ($cookie_canary_session = "stable") {
            set $backend_pool "ghost_stable";
        }

        # Proxy settings
        proxy_pass http://$backend_pool;

        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Header configuration
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;

        # Add canary tracking header
        proxy_set_header X-Canary-Version $upstream_server;
        add_header X-Canary-Version $upstream_server always;

        # Add response header indicating which backend served the request
        add_header X-Served-By $upstream_server always;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 2048m;
        proxy_temp_file_write_size 32k;

        # Cache settings
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API endpoint with higher rate limit
    location /api/ {
        limit_req zone=api burst=500 nodelay;

        set $backend_pool $canary_backend;

        if ($cookie_canary_session = "canary") {
            set $backend_pool "ghost_canary";
        }
        if ($cookie_canary_session = "stable") {
            set $backend_pool "ghost_stable";
        }

        proxy_pass http://$backend_pool;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Canary-Version $upstream_server;

        add_header X-Canary-Version $upstream_server always;
        add_header X-Served-By $upstream_server always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 16 4k;
        proxy_busy_buffers_size 8k;
    }

    # Static assets with caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://$backend_pool;
        proxy_cache_valid 200 30d;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, immutable, max-age=2592000";
        add_header X-Served-By $upstream_server always;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 502 503 504 /5xx.html;
    location = /5xx.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Metrics endpoint for monitoring (optional)
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
}
