name: Nightly Build

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

permissions:
  contents: read
  issues: write

jobs:
  # This workflow now serves as an orchestrator for nightly tasks
  # The actual Lane C (Nightly/Live) tests run in a separate workflow
  # See: .github/workflows/lane-c-nightly.yml

  full-integration-tests:
    name: Full Integration Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Install Patchright
        run: |
          dotnet tool install --global Patchright.CLI || true
          patchright install chromium

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run All Integration Tests
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --filter "Category=Integration" \
            -nodereuse:false

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 30

  code-coverage:
    name: Full Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Install Patchright
        run: |
          dotnet tool install --global Patchright.CLI || true
          patchright install chromium

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run All Tests with Coverage
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --filter "Category!=E2E" \
            -nodereuse:false \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Generate Coverage Report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool || true
          reportgenerator \
            -reports:**/TestResults/**/coverage.cobertura.xml \
            -targetdir:./coverage-report \
            -reporttypes:Html;TextSummary

      - name: Display Coverage Summary
        run: |
          echo "## 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ./coverage-report/Summary.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report/
          retention-days: 30

      - name: Check Coverage Threshold
        run: |
          # Extract line coverage percentage
          COVERAGE=$(grep "Line coverage:" ./coverage-report/Summary.txt | grep -oP '\d+\.\d+%' | grep -oP '\d+')
          echo "Coverage: ${COVERAGE}%"

          if [ "$COVERAGE" -lt 80 ]; then
            echo "⚠️ Code coverage (${COVERAGE}%) is below threshold (80%)"
            exit 1
          fi

  nightly-summary:
    name: Nightly Build Summary
    runs-on: ubuntu-latest
    needs: [full-integration-tests, code-coverage]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🌙 Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Lanes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Lane C (Nightly/Live):** E2E tests + Live provider smoke tests" >> $GITHUB_STEP_SUMMARY
          echo "  See: [Lane C (Nightly/Live)](../../actions/workflows/lane-c-nightly.yml)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.full-integration-tests.result }}" == "success" ]]; then
            echo "✅ **Integration Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.code-coverage.result }}" == "success" ]]; then
            echo "✅ **Code Coverage:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Coverage:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-build,automated'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Nightly Build Failure')
            );

            const body = `## 🌙 Nightly Build Failure

            **Date:** ${new Date().toISOString()}
            **Run:** ${context.runId}

            ### Failed Jobs

            ${context.payload.jobs.filter(j => j.conclusion === 'failure').map(j => `- ❌ ${j.name}`).join('\n')}

            [View Workflow Run](${context.payload.workflow_run.html_url})
            `;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🌙 Nightly Build Failure',
                body: body,
                labels: ['nightly-build', 'automated', 'bug']
              });
            }
