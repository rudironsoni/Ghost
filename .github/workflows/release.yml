name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (major, minor, patch)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version tag
        id: version
        run: |
          git fetch --tags --force
          latest=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          version=${latest#v}
          IFS='.' read -r major minor patch <<< "$version"
          bump="${{ inputs.bump }}"
          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch|*)
              patch=$((patch + 1))
              ;;
          esac
          new_tag="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/$new_tag" >/dev/null; then
            echo "Tag $new_tag already exists" >&2
            exit 1
          fi
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Ghost.WebApi/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghost-webapi:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/ghost-webapi:latest
