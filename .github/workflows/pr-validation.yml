name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '**/*.csproj'
      - '.github/workflows/pr-validation.yml'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR Title Format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventionalCommitRegex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+$/i;
            
            if (!conventionalCommitRegex.test(title)) {
              core.setFailed(
                `PR title does not follow conventional commits format.\n\n` +
                `Expected format: type(scope): description\n` +
                `Example: "feat(linkedin): add new parser"\n\n` +
                `Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert\n` +
                `Scope is optional but recommended.\n\n` +
                `Current title: "${title}"`
              );
            } else {
              core.info(`✓ PR title follows conventional commits format: "${title}"`);
            }

  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Tools
        run: dotnet tool restore

      - name: Check Formatting
        run: dotnet format Ghost.sln --verify-no-changes --verbosity diagnostic

  build:
    name: Build Solution
    runs-on: ubuntu-latest
    needs: validate-title
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-output
          path: |
            **/bin/Release/
            !**/bin/Release/**/*.pdb
          retention-days: 1

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Run Unit Tests
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --filter "FullyQualifiedName!~E2E" \
            -- RunConfiguration.MaxCpuCount=2

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: PR Unit Tests
          path: '**/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

  check-migrations:
    name: Check DotnetSpider References
    runs-on: ubuntu-latest
    needs: validate-title
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          git diff --name-only $BASE_SHA...$HEAD_SHA | grep -E '^(src/|tests/)' > changed_files.txt || true
          
          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for DotnetSpider References
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          FOUND_REFERENCES=false
          
          while IFS= read -r file; do
            if [ -f "$file" ] && grep -i "DotnetSpider" "$file"; then
              echo "❌ Found DotnetSpider reference in: $file"
              FOUND_REFERENCES=true
            fi
          done < changed_files.txt
          
          if [ "$FOUND_REFERENCES" = true ]; then
            echo "❌ VALIDATION FAILED: DotnetSpider references detected"
            echo "Please update your changes to use Ghost.Sdk.Spider instead."
            exit 1
          else
            echo "✓ No DotnetSpider references found in changed files"
          fi

  pr-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-title, lint-format, build, test, check-migrations]
    if: always()
    steps:
      - name: Check Validation Results
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Validate PR Title', result: '${{ needs.validate-title.result }}' },
              { name: 'Lint & Format Check', result: '${{ needs.lint-format.result }}' },
              { name: 'Build Solution', result: '${{ needs.build.result }}' },
              { name: 'Run Unit Tests', result: '${{ needs.test.result }}' },
              { name: 'Check DotnetSpider References', result: '${{ needs.check-migrations.result }}' }
            ];
            
            let allPassed = true;
            let summary = '## 🔍 PR Validation Results\n\n';
            
            for (const job of jobs) {
              const icon = job.result === 'success' ? '✅' : '❌';
              summary += `${icon} **${job.name}**: ${job.result}\n`;
              if (job.result !== 'success') {
                allPassed = false;
              }
            }
            
            summary += '\n';
            
            if (allPassed) {
              summary += '### ✅ All validation checks passed!\n\n';
              summary += 'This PR is ready for review.\n';
            } else {
              summary += '### ❌ Some validation checks failed\n\n';
              summary += 'Please review the failed checks above and make necessary corrections.\n';
              core.setFailed('PR validation failed');
            }
            
            core.summary.addRaw(summary);
            await core.summary.write();
