name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    
    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            
            // Conventional commit format: type(scope): description
            // Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
            const conventionalCommitRegex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+$/i;
            
            if (!conventionalCommitRegex.test(title)) {
              core.setFailed(
                `PR title does not follow conventional commits format.\n\n` +
                `Expected format: type(scope): description\n` +
                `Example: "feat(linkedin): add new parser"\n\n` +
                `Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert\n` +
                `Scope is optional but recommended.\n\n` +
                `Current title: "${title}"`
              );
            } else {
              core.info(`✓ PR title follows conventional commits format: "${title}"`);
            }

  build:
    name: Build Solution
    runs-on: ubuntu-latest
    needs: validate-title
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-paths: |
            ~/.nuget/packages
      
      - name: Restore dependencies
        run: dotnet restore Ghost.sln
      
      - name: Build solution
        run: dotnet build Ghost.sln --configuration Release --no-restore --warnaserror
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-output
          path: |
            **/bin/Release/
            **/obj/Release/
          retention-days: 1

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-paths: |
            ~/.nuget/packages
      
      - name: Restore dependencies
        run: dotnet restore Ghost.sln
      
      - name: Build solution
        run: dotnet build Ghost.sln --configuration Release --no-restore --warnaserror
      
      - name: Run unit tests
        run: |
          dotnet test Ghost.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --filter "FullyQualifiedName!~E2E"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 7
      
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: PR Unit Tests
          path: '**/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

  check-migrations:
    name: Check DotnetSpider References
    runs-on: ubuntu-latest
    needs: validate-title
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get changed files
        id: changed-files
        run: |
          # Get the base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          
          # Get all changed files in src/ and tests/
          git diff --name-only $BASE_SHA...$HEAD_SHA | grep -E '^(src/|tests/)' > changed_files.txt || true
          
          if [ -s changed_files.txt ]; then
            echo "Changed files:"
            cat changed_files.txt
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes in src/ or tests/ directories"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Check for DotnetSpider references in changed files
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          echo "Checking for DotnetSpider references in changed files..."
          
          # Check each changed file for DotnetSpider references
          FOUND_REFERENCES=false
          
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              if grep -i "DotnetSpider" "$file"; then
                echo "❌ Found DotnetSpider reference in: $file"
                FOUND_REFERENCES=true
              fi
            fi
          done < changed_files.txt
          
          if [ "$FOUND_REFERENCES" = true ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "❌ VALIDATION FAILED: DotnetSpider references detected"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "This PR adds new DotnetSpider references, which is not allowed."
            echo "The project is migrating away from DotnetSpider to Ghost.Sdk.Spider."
            echo ""
            echo "Please update your changes to use Ghost.Sdk.Spider instead."
            echo "════════════════════════════════════════════════════════════"
            exit 1
          else
            echo "✓ No DotnetSpider references found in changed files"
          fi
      
      - name: Check for DotnetSpider in all src/ and tests/
        run: |
          echo "Double-checking all src/ and tests/ directories..."
          
          # This is a safety check to ensure no DotnetSpider references exist
          # Use grep -r with || true to prevent pipeline failure
          GREP_OUTPUT=$(grep -r "DotnetSpider" src/ tests/ 2>/dev/null || true)
          
          if [ -n "$GREP_OUTPUT" ]; then
            echo "⚠️  Warning: DotnetSpider references still exist in the codebase:"
            echo "$GREP_OUTPUT"
            echo ""
            echo "Note: This is informational only. The check above ensures no NEW references were added."
          else
            echo "✓ No DotnetSpider references found in src/ and tests/ directories"
          fi

  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-title, build, test, check-migrations]
    if: always()
    
    steps:
      - name: Check validation results
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Validate PR Title', result: '${{ needs.validate-title.result }}' },
              { name: 'Build Solution', result: '${{ needs.build.result }}' },
              { name: 'Run Unit Tests', result: '${{ needs.test.result }}' },
              { name: 'Check DotnetSpider References', result: '${{ needs.check-migrations.result }}' }
            ];
            
            let allPassed = true;
            let summary = '## PR Validation Results\n\n';
            
            for (const job of jobs) {
              const icon = job.result === 'success' ? '✅' : '❌';
              summary += `${icon} **${job.name}**: ${job.result}\n`;
              if (job.result !== 'success') {
                allPassed = false;
              }
            }
            
            summary += '\n';
            
            if (allPassed) {
              summary += '### ✅ All validation checks passed!\n\n';
              summary += 'This PR is ready for review.\n';
            } else {
              summary += '### ❌ Some validation checks failed\n\n';
              summary += 'Please review the failed checks above and make necessary corrections.\n';
              core.setFailed('PR validation failed');
            }
            
            core.summary.addRaw(summary);
            await core.summary.write();
            
            // Also add as a comment on the PR
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: summary
            });
