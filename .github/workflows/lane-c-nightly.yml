name: CI - Lane C (Nightly/Live)

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

concurrency:
  group: lane-c-nightly
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-build-output
          path: |
            **/bin/Release/
            !**/bin/Release/**/*.pdb
          retention-days: 1

  e2e-tests:
    name: E2E Tests (Live Providers)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Install Patchright Browsers
        run: pwsh ~/.nuget/packages/patchright/*/buildTransitive/playwright.ps1 install chromium --with-deps

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run E2E Tests (Shard ${{ matrix.shard }})
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=e2e-test-results-shard-${{ matrix.shard }}.trx" \
            --filter "Category=E2E" \
            -nodereuse:false

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-e2e-test-results-shard-${{ matrix.shard }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.png
            **/TestResults/**/*.webm
          retention-days: 30

  live-provider-tests:
    name: Live Provider Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    continue-on-error: true  # Non-blocking for PR/merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Install Patchright Browsers
        run: pwsh ~/.nuget/packages/patchright/*/buildTransitive/playwright.ps1 install chromium --with-deps

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run Live Provider Tests
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=live-provider-test-results.trx" \
            --filter "Capability=RequiresProviderLive" \
            -nodereuse:false

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-live-provider-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.png
            **/TestResults/**/*.webm
          retention-days: 30

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Run Performance Benchmarks
        run: |
          for proj in $(find tests -name "*Benchmarks.csproj" 2>/dev/null); do
            echo "Running benchmarks in $proj"
            dotnet run --project "$proj" --configuration ${{ env.CONFIGURATION }} --no-build || true
          done

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-benchmark-results
          path: |
            **/BenchmarkDotNet.Artifacts/**
          retention-days: 30

  stability-tests:
    name: Stability Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Install Patchright Browsers
        run: pwsh ~/.nuget/packages/patchright/*/buildTransitive/playwright.ps1 install chromium --with-deps

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run Stability Tests
        run: |
          for i in {1..10}; do
            echo "Stability run $i of 10"
            dotnet test Ghost.sln \
              --configuration ${{ env.CONFIGURATION }} \
              --no-build \
              --logger "trx;LogFileName=stability-run-$i.trx" \
              --filter "Category=E2E&Priority=Critical" \
              -nodereuse:false || true
          done

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Analyze Stability Results
        if: always()
        run: |
          echo "# Stability Test Analysis" > stability-report.md
          echo "" >> stability-report.md
          TOTAL_RUNS=10
          PASSED=$(grep -r "Passed!" **/TestResults/stability-run-*.trx 2>/dev/null | wc -l || echo "0")
          FAILED=$(grep -r "Failed!" **/TestResults/stability-run-*.trx 2>/dev/null | wc -l || echo "0")
          PASS_RATE=$((PASSED * 100 / TOTAL_RUNS))
          echo "**Total Runs:** $TOTAL_RUNS" >> stability-report.md
          echo "**Passed:** $PASSED" >> stability-report.md
          echo "**Failed:** $FAILED" >> stability-report.md
          echo "**Pass Rate:** $PASS_RATE%" >> stability-report.md
          echo "" >> stability-report.md
          if [ $PASS_RATE -lt 90 ]; then
            echo "⚠️ **WARNING:** Pass rate below 90% - tests may be flaky" >> stability-report.md
          else
            echo "✅ Tests are stable" >> stability-report.md
          fi
          cat stability-report.md

      - name: Upload Stability Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-stability-test-results
          path: |
            **/TestResults/stability-run-*.trx
            stability-report.md
          retention-days: 30

  lane-c-summary:
    name: Lane C Summary (Nightly/Live)
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, live-provider-tests, performance-benchmarks, stability-tests]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🌙 Lane C: Nightly/Live (Non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scope: E2E tests + Live provider smoke tests\n" >> $GITHUB_STEP_SUMMARY
          echo "- Live providers\n" >> $GITHUB_STEP_SUMMARY
          echo "- Sequential/low parallelism\n" >> $GITHUB_STEP_SUMMARY
          echo "- Non-blocking for PR/merge\n" >> $GITHUB_STEP_SUMMARY
          echo "- Failure signals provider drift\n" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ **Build:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.e2e-tests.result }}" == "success" ]]; then
            echo "✅ **E2E Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.live-provider-tests.result }}" == "success" ]]; then
            echo "✅ **Live Provider Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.live-provider-tests.result }}" == "failure" ]]; then
            echo "⚠️ **Live Provider Tests:** Failed (Non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Live Provider Tests:** Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.performance-benchmarks.result }}" == "success" ]]; then
            echo "✅ **Performance Benchmarks:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.performance-benchmarks.result }}" == "failure" ]]; then
            echo "⚠️ **Performance Benchmarks:** Issues Found (Non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Performance Benchmarks:** Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.stability-tests.result }}" == "success" ]]; then
            echo "✅ **Stability Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.stability-tests.result }}" == "failure" ]]; then
            echo "⚠️ **Stability Tests:** Issues Found (Non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Stability Tests:** Skipped" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lane-c-nightly,automated'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Lane C Nightly Failure')
            );

            const body = `## 🌙 Lane C Nightly Failure

            **Date:** ${new Date().toISOString()}
            **Run:** ${context.runId}

            ### Failed Jobs

            ${context.payload.jobs.filter(j => j.conclusion === 'failure').map(j => `- ❌ ${j.name}`).join('\n')}

            [View Workflow Run](${context.payload.workflow_run.html_url})
            `;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🌙 Lane C Nightly Failure',
                body: body,
                labels: ['lane-c-nightly', 'automated', 'bug']
              });
            }
