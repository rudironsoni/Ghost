name: publish-package
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'tests/**'
      - '.github/**'
 
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          useConfigFile: true

      - name: Restore
        run: dotnet restore Ghost.sln

      - name: Build
        run: dotnet build Ghost.sln --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Pack
        run: dotnet pack Ghost.sln --configuration Release --no-build --output ./artifacts/packages /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Publish to NuGet (GitHub)
        run: |
          # Add GitHub Packages source (ignore failure if it already exists)
          dotnet nuget add source --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
          # Push packages using GITHUB_TOKEN as the API key (quoted to avoid whitespace issues)
          dotnet nuget push "./artifacts/packages/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
