name: CI - Lane B (Merge Gate)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '**/*.csproj'
      - '.github/workflows/lane-b-merge-gate.yml'
  workflow_dispatch:

concurrency:
  group: lane-b-merge-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: |
            **/bin/Release/
            **/obj/Release/
          key: ${{ runner.os }}-build-lane-b-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-lane-b-
            ${{ runner.os }}-build-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lane-b-build-output
          path: |
            **/bin/Release/
            !**/bin/Release/**/*.pdb
          retention-days: 7

  system-tests:
    name: System Tests (Synthetic)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Install Patchright Browsers
        run: pwsh ~/.nuget/packages/patchright/*/buildTransitive/playwright.ps1 install chromium --with-deps

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run System Tests
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=system-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --filter "Category=System&Capability=RequiresSyntheticServer" \
            -nodereuse:false

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-b-system-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 14

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/TestResults/**/coverage.cobertura.xml'
          flags: lane-b-system
          name: lane-b-system-tests-coverage

  synthetic-integration-tests:
    name: Synthetic Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore --warnaserror -p:NoWarn=CA1016

      - name: Install Patchright Browsers
        run: pwsh ~/.nuget/packages/patchright/*/buildTransitive/playwright.ps1 install chromium --with-deps

      - name: Pre-test Cleanup
        run: ./tests/scripts/pre-test.sh

      - name: Run Synthetic Integration Tests
        run: |
          dotnet test Ghost.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=synthetic-integration-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --filter "Category=Integration&Capability=RequiresSyntheticServer" \
            -nodereuse:false

      - name: Post-test Cleanup
        if: always()
        run: ./tests/scripts/post-test.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-b-synthetic-integration-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 14

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/TestResults/**/coverage.cobertura.xml'
          flags: lane-b-synthetic-integration
          name: lane-b-synthetic-integration-coverage

  lane-b-summary:
    name: Lane B Summary (Merge Gate)
    runs-on: ubuntu-latest
    needs: [build, system-tests, synthetic-integration-tests]
    if: always()
    steps:
      - name: Check Results
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Build Solution', result: '${{ needs.build.result }}' },
              { name: 'System Tests (Synthetic)', result: '${{ needs.system-tests.result }}' },
              { name: 'Synthetic Integration Tests', result: '${{ needs.synthetic-integration-tests.result }}' }
            ];

            let allPassed = true;
            let summary = '## 🚦 Lane B: Merge Gate (Controlled)\n\n';
            summary += '### Scope: System tests with synthetic browser + mock server\n';
            summary += '- Deterministic but slower\n';
            summary += '- Controlled parallelism\n';
            summary += '- Must pass for merge to main\n\n';

            for (const job of jobs) {
              const icon = job.result === 'success' ? '✅' : '❌';
              summary += `${icon} **${job.name}**: ${job.result}\n`;
              if (job.result !== 'success') {
                allPassed = false;
              }
            }

            summary += '\n';

            if (allPassed) {
              summary += '### ✅ Lane B Passed - Merge to main allowed\n\n';
              summary += 'This commit meets the merge gate requirements.\n';
            } else {
              summary += '### ❌ Lane B Failed - Merge blocked\n\n';
              summary += 'Please review the failed checks above and make necessary corrections.\n';
              core.setFailed('Lane B failed - Merge blocked');
            }

            core.summary.addRaw(summary);
            await core.summary.write();
