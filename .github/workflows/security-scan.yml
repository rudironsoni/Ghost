name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '**/Dockerfile'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read
  security-events: write
  issues: write

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  codeql-sast:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '**/obj/**'
              - '**/bin/**'
              - '**/*.Designer.cs'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Build Solution
        run: dotnet build Ghost.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
          output: sarif-results
          upload: true

      - name: Upload CodeQL Results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: sarif-results
          retention-days: 30

  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Scan for Vulnerable Packages
        id: vuln-scan
        continue-on-error: true
        run: |
          echo "# Vulnerability Scan Report" > vulnerability-report.md
          echo "" >> vulnerability-report.md
          echo "## NuGet Package Vulnerabilities" >> vulnerability-report.md
          echo "" >> vulnerability-report.md
          
          dotnet list Ghost.sln package --vulnerable --include-transitive > vuln-output.txt 2>&1
          
          if grep -q "has the following vulnerable packages" vuln-output.txt; then
            echo "⚠️ VULNERABLE DEPENDENCIES FOUND" >> vulnerability-report.md
            echo "" >> vulnerability-report.md
            echo "\`\`\`" >> vulnerability-report.md
            cat vuln-output.txt >> vulnerability-report.md
            echo "\`\`\`" >> vulnerability-report.md
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No vulnerable packages found" >> vulnerability-report.md
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
          fi
          
          cat vulnerability-report.md

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: vulnerability-report.md
          retention-days: 30

      - name: Create Issue if Vulnerabilities Found
        if: steps.vuln-scan.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('vulnerability-report.md', 'utf8');
            
            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Vulnerable Dependencies Detected')
            );
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Updated Vulnerability Scan - ${new Date().toISOString()}\n\n${report}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Vulnerable Dependencies Detected',
                body: report,
                labels: ['security', 'dependencies', 'automated']
              });
            }

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: |
            title = "Ghost Security Scan"
            
            [[rules]]
            description = "Generic API Key"
            regex = '''(?i)(api[_-]?key|apikey)[\s]*[:=][\s]*['"]?[a-zA-Z0-9]{32,}['"]?'''
            
            [[rules]]
            description = "Generic Secret"
            regex = '''(?i)(secret|password|passwd|pwd)[\s]*[:=][\s]*['"]?[^\s'"]{8,}['"]?'''
            
            [[rules]]
            description = "GitHub Token"
            regex = '''ghp_[0-9a-zA-Z]{36}'''
            
            [[rules]]
            description = "NuGet API Key"
            regex = '''oy2[a-z0-9]{43}'''

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'  # Skip for scheduled runs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Ghost.WebApi/Dockerfile
          push: false
          load: true
          tags: ghost-security-scan:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghost-security-scan:test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container-scan

      - name: Generate Trivy Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghost-security-scan:test
          format: table
          output: trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: Generate SBOM (SPDX)
        run: |
          mkdir -p ./security-artifacts/sbom
          dotnet CycloneDX Ghost.sln -o ./security-artifacts/sbom -f spdx-json -sv 2.3

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet CycloneDX Ghost.sln -o ./security-artifacts/sbom -f json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: ./security-artifacts/sbom/
          retention-days: 90

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Restore Dependencies
        run: dotnet restore Ghost.sln

      - name: List All Package Licenses
        run: |
          echo "# License Compliance Report" > license-report.md
          echo "" >> license-report.md
          echo "## Package Licenses" >> license-report.md
          echo "" >> license-report.md
          
          dotnet list Ghost.sln package --include-transitive > packages.txt
          
          echo "\`\`\`" >> license-report.md
          cat packages.txt >> license-report.md
          echo "\`\`\`" >> license-report.md

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.md
          retention-days: 30

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql-sast, dependency-vulnerability-scan, secret-detection, sbom-generation, license-compliance]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.codeql-sast.result }}" == "success" ]]; then
            echo "✅ **CodeQL SAST:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CodeQL SAST:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.dependency-vulnerability-scan.result }}" == "success" ]]; then
            echo "✅ **Dependency Scan:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Dependency Scan:** Issues Found" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.secret-detection.result }}" == "success" ]]; then
            echo "✅ **Secret Detection:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Secret Detection:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.sbom-generation.result }}" == "success" ]]; then
            echo "✅ **SBOM Generation:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **SBOM Generation:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.license-compliance.result }}" == "success" ]]; then
            echo "✅ **License Compliance:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **License Compliance:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
