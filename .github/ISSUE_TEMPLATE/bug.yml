name: Bug report
description: Report a bug to help us improve Ghost
title: "Bug: [short description]"
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the
        information below to help us investigate.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, Ghost version, and other environment details
      placeholder: e.g. macOS 12.3, .NET 7.0, Ghost v5.0.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal set of steps we can follow to reproduce the bug
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened
  - type: input
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste relevant logs, error messages, or stack traces
  - type: input
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Links to screenshots or screen recordings (if applicable)
