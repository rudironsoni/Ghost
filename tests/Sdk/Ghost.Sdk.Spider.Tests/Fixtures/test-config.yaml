id: test-spider-id
name: test-spider
version: 1.0.0

target:
  startUrls:
    - https://example.com
    - https://example.org

options:
  maxConcurrency: 5
  maxRequests: 100
  timeout: 30s
  requestDelay: 1s
  userAgent: "Ghost.Sdk.Spider/1.0 (Test)"

extractors:
  - name: mainContent
    selector: .content
    selectorType: Css
    fields:
      - name: title
        selector: h1
        selectorType: Css
        formatters:
          - type: Trim
      - name: body
        selector: .body
        selectorType: Css
        formatters:
          - type: Trim
          - type: HtmlDecode

storage:
  type: Console
  options:
    prettyPrint: true

scheduling:
  enabled: false
  cronExpression: "0 0 * * *"
