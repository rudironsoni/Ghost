services:
  ghostwright-webapi:
    build:
      context: .
      dockerfile: src/Ghost.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Ghost__Kernel__Headless=true
      - Ghost__Kernel__MaxConcurrentSessions=5
      - Ghost__Extensions__LinkedIn__Enabled=true
      - Ghost__Extensions__Google__Enabled=false
      - Ghost__Extensions__OpenAI__Enabled=false
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
