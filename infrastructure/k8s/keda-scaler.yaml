---
# KEDA (Kubernetes Event-Driven Autoscaling) ScaledObject
# This provides queue-based autoscaling using Redis list length
# More accurate than HPA for queue-driven workloads

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ghost-worker-scaler
  namespace: ghost
  labels:
    app: ghost
    component: worker
spec:
  scaleTargetRef:
    name: ghost-worker
  pollingInterval: 15 # Check queue depth every 15 seconds
  cooldownPeriod: 300 # Wait 5 minutes before scaling down
  idleReplicaCount: 0 # Do not scale to zero (maintain minReplicaCount)
  minReplicaCount: 3
  maxReplicaCount: 100
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          - type: Pods
            value: 5
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 10
            periodSeconds: 60
  triggers:
  # Redis list length trigger
  - type: redis
    metadata:
      address: redis-service.ghost.svc.cluster.local:6379
      passwordFromEnv: REDIS_PASSWORD
      listName: ghost:jobs:queue
      listLength: "100" # Target 100 jobs per worker
      activationListLength: "10" # Start scaling at 10 jobs
      databaseIndex: "0"
  # CPU trigger (backup/additional scaling signal)
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"

---
# TriggerAuthentication for KEDA to access Redis password

apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ghost-redis-trigger-auth
  namespace: ghost
spec:
  secretTargetRef:
  - parameter: password
    name: ghost-worker-secrets
    key: REDIS_PASSWORD
