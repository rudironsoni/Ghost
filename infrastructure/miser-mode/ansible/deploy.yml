---
# Ghost Platform Ultra Miser Mode - Deployment Playbook
#
# This playbook deploys the Ghost Platform Docker Compose stack
# Run this after the setup.yml playbook has completed successfully
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml deploy.yml
#   ansible-playbook -i inventory/hosts.yml deploy.yml --tags update
#   ansible-playbook -i inventory/hosts.yml deploy.yml --extra-vars "ghost_version=latest"

- name: Ghost Platform Ultra Miser Mode - Application Deployment
  hosts: ghost_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display deployment information
      debug:
        msg:
          - "==================================================="
          - "Ghost Platform Ultra Miser Mode - Deployment"
          - "==================================================="
          - "Target Host: {{ inventory_hostname }}"
          - "Install Directory: {{ ghost_install_dir }}"
          - "Domain: {{ domain_name | default('Not configured') }}"
          - "==================================================="
      tags: always

    - name: Verify Docker is installed
      command: docker --version
      register: docker_version
      changed_when: false
      failed_when: docker_version.rc != 0
      tags: always

    - name: Verify Docker Compose is installed
      command: docker compose version
      register: compose_version
      changed_when: false
      failed_when: compose_version.rc != 0
      tags: always

  roles:
    - role: ghost
      tags:
        - ghost
        - deploy
        - update

  post_tasks:
    - name: Wait for Ghost API to be ready
      uri:
        url: "http://{{ ansible_default_ipv4.address }}:8080/health"
        status_code: 200
        timeout: 5
      register: api_health
      until: api_health.status == 200
      retries: 30
      delay: 10
      tags:
        - verify
        - health

    - name: Display deployment completion message
      debug:
        msg:
          - "==================================================="
          - "Ghost Platform Deployment Complete!"
          - "==================================================="
          - "API URL: http://{{ domain_name | default(ansible_default_ipv4.address) }}:8080"
          - "Health Check: http://{{ domain_name | default(ansible_default_ipv4.address) }}:8080/health"
          - "RabbitMQ Management: http://{{ domain_name | default(ansible_default_ipv4.address) }}:15672"
          - "Grafana: http://{{ domain_name | default(ansible_default_ipv4.address) }}:3000"
          - "Prometheus: http://{{ domain_name | default(ansible_default_ipv4.address) }}:9090"
          - "==================================================="
          - "Credentials:"
          - "  RabbitMQ: {{ rabbitmq_user }}/{{ rabbitmq_password }}"
          - "  Grafana: admin/{{ grafana_password }}"
          - "==================================================="
      tags: always

    - name: Save deployment timestamp
      copy:
        content: |
          Ghost Platform Ultra Miser Mode
          Last deployment: {{ ansible_date_time.iso8601 }}
          Deployed by: {{ ansible_user_id }}
          Version: {{ ghost_version }}
        dest: "{{ ghost_install_dir }}/.deployment-info"
        owner: root
        group: root
        mode: '0644'
      tags: always
