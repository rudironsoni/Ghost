---
# Monitoring role - Prometheus node exporter

- name: Create monitoring user
  user:
    name: prometheus
    shell: /bin/false
    system: yes
    create_home: no
  tags:
    - monitoring

- name: Download Prometheus node exporter
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: '0644'
  when: node_exporter_enabled
  tags:
    - monitoring

- name: Extract node exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp/
    remote_src: yes
  when: node_exporter_enabled
  tags:
    - monitoring

- name: Install node exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: yes
  when: node_exporter_enabled
  notify: restart node-exporter
  tags:
    - monitoring

- name: Create node exporter systemd service
  template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node-exporter.service
    owner: root
    group: root
    mode: '0644'
  when: node_exporter_enabled
  notify:
    - reload systemd
    - restart node-exporter
  tags:
    - monitoring

- name: Start and enable node exporter
  service:
    name: node-exporter
    state: started
    enabled: yes
  when: node_exporter_enabled
  tags:
    - monitoring

- name: Allow Prometheus node exporter port in firewall
  ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    comment: 'Prometheus Node Exporter'
  when: node_exporter_enabled
  tags:
    - monitoring
    - firewall

- name: Clean up temporary files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/node_exporter.tar.gz
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
  tags:
    - monitoring
    - cleanup

- name: Install monitoring utilities
  apt:
    name:
      - prometheus-node-exporter-collectors
      - sysstat
      - iotop
      - iftop
    state: present
  tags:
    - monitoring

- name: Configure sysstat
  lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: restart sysstat
  tags:
    - monitoring

- name: Start and enable sysstat
  service:
    name: sysstat
    state: started
    enabled: yes
  tags:
    - monitoring
