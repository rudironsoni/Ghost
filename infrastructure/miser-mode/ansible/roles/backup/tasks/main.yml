---
# Backup role - Configure backup scripts and cron jobs

- name: Install backup utilities
  apt:
    name:
      - rsync
      - gzip
      - pigz
      - pv
      - awscli
    state: present
  tags:
    - backup

- name: Create backup directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ghost_user }}"
    group: "{{ ghost_group }}"
    mode: '0750'
  loop:
    - "{{ ghost_backup_dir }}"
    - "{{ ghost_backup_dir }}/postgres"
    - "{{ ghost_backup_dir }}/redis"
    - "{{ ghost_backup_dir }}/rabbitmq"
    - "{{ ghost_backup_dir }}/ghost-data"
    - "{{ ghost_backup_dir }}/logs"
  tags:
    - backup
    - directories

- name: Create backup scripts directory
  file:
    path: /usr/local/bin/ghost-backup
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - backup

- name: Deploy database backup script
  template:
    src: backup-postgres.sh.j2
    dest: /usr/local/bin/ghost-backup/backup-postgres.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - backup
    - scripts

- name: Deploy Redis backup script
  template:
    src: backup-redis.sh.j2
    dest: /usr/local/bin/ghost-backup/backup-redis.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - backup
    - scripts

- name: Deploy full backup script
  template:
    src: backup-full.sh.j2
    dest: /usr/local/bin/ghost-backup/backup-full.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - backup
    - scripts

- name: Deploy S3 sync script
  template:
    src: backup-s3-sync.sh.j2
    dest: /usr/local/bin/ghost-backup/backup-s3-sync.sh
    owner: root
    group: root
    mode: '0755'
  when: backup_s3_bucket is defined
  tags:
    - backup
    - scripts
    - s3

- name: Configure AWS credentials
  template:
    src: aws-credentials.j2
    dest: /root/.aws/credentials
    owner: root
    group: root
    mode: '0600'
  when: 
    - backup_s3_bucket is defined
    - backup_s3_access_key is defined
    - backup_s3_secret_key is defined
  tags:
    - backup
    - s3

- name: Create backup cleanup script
  template:
    src: cleanup-backups.sh.j2
    dest: /usr/local/bin/ghost-backup/cleanup-backups.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - backup
    - scripts

- name: Schedule database backup cron job
  cron:
    name: "Ghost PostgreSQL Backup"
    minute: "{{ backup_schedule_minute }}"
    hour: "{{ backup_schedule_hour }}"
    job: "/usr/local/bin/ghost-backup/backup-postgres.sh >> {{ ghost_log_dir }}/backup.log 2>&1"
    user: root
    state: present
  tags:
    - backup
    - cron

- name: Schedule full backup cron job
  cron:
    name: "Ghost Full Backup"
    minute: "{{ backup_schedule_minute }}"
    hour: "{{ backup_schedule_hour }}"
    weekday: "0"  # Sunday
    job: "/usr/local/bin/ghost-backup/backup-full.sh >> {{ ghost_log_dir }}/backup.log 2>&1"
    user: root
    state: present
  tags:
    - backup
    - cron

- name: Schedule S3 sync cron job
  cron:
    name: "Ghost Backup S3 Sync"
    minute: "30"
    hour: "{{ backup_schedule_hour }}"
    job: "/usr/local/bin/ghost-backup/backup-s3-sync.sh >> {{ ghost_log_dir }}/backup.log 2>&1"
    user: root
    state: present
  when: backup_s3_bucket is defined
  tags:
    - backup
    - cron
    - s3

- name: Schedule backup cleanup cron job
  cron:
    name: "Ghost Backup Cleanup"
    minute: "0"
    hour: "4"
    job: "/usr/local/bin/ghost-backup/cleanup-backups.sh >> {{ ghost_log_dir }}/backup.log 2>&1"
    user: root
    state: present
  tags:
    - backup
    - cron

- name: Create backup restore documentation
  template:
    src: RESTORE.md.j2
    dest: "{{ ghost_backup_dir }}/RESTORE.md"
    owner: root
    group: root
    mode: '0644'
  tags:
    - backup
    - documentation
