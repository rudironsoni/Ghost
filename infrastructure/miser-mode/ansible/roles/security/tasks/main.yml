---
# Security role - Firewall, fail2ban, SSH hardening

- name: Install UFW firewall
  apt:
    name: ufw
    state: present
  tags:
    - security
    - firewall

- name: Reset UFW firewall
  ufw:
    state: reset
  tags:
    - security
    - firewall

- name: Configure UFW defaults
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
    - { direction: 'routed', policy: 'deny' }
  tags:
    - security
    - firewall

- name: Allow SSH
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    comment: 'SSH Access'
  tags:
    - security
    - firewall

- name: Allow application ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "Ghost Platform"
  loop: "{{ firewall_allowed_tcp_ports }}"
  tags:
    - security
    - firewall

- name: Allow from trusted IPs
  ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: "{{ firewall_trusted_ips }}"
  when: firewall_trusted_ips | length > 0
  tags:
    - security
    - firewall

- name: Enable UFW logging
  ufw:
    logging: 'on'
  tags:
    - security
    - firewall

- name: Enable UFW firewall
  ufw:
    state: enabled
  tags:
    - security
    - firewall

- name: Harden SSH configuration
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
    backup: yes
  notify: restart sshd
  tags:
    - security
    - ssh

- name: Install fail2ban
  apt:
    name:
      - fail2ban
      - whois
    state: present
  when: fail2ban_enabled
  tags:
    - security
    - fail2ban

- name: Configure fail2ban
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban
  when: fail2ban_enabled
  tags:
    - security
    - fail2ban

- name: Create fail2ban filter for Ghost
  template:
    src: ghost-auth.conf.j2
    dest: /etc/fail2ban/filter.d/ghost-auth.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban
  when: fail2ban_enabled
  tags:
    - security
    - fail2ban

- name: Start and enable fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes
  when: fail2ban_enabled
  tags:
    - security
    - fail2ban

- name: Install security packages
  apt:
    name:
      - aide
      - rkhunter
      - apparmor
      - apparmor-utils
    state: present
  tags:
    - security
    - hardening

- name: Disable unnecessary services
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - cups
    - avahi-daemon
    - bluetooth
  ignore_errors: yes
  tags:
    - security
    - hardening

- name: Set secure permissions on sensitive files
  file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
    group: root
  loop:
    - /etc/crontab
    - /etc/ssh/sshd_config
  tags:
    - security
    - permissions

- name: Configure audit logging
  apt:
    name: auditd
    state: present
  tags:
    - security
    - audit

- name: Start and enable auditd
  service:
    name: auditd
    state: started
    enabled: yes
  tags:
    - security
    - audit
