groups:
  - name: resource_utilization
    interval: 30s
    rules:
      # CPU usage percentage per container
      - record: container:cpu_usage_percent:rate1m
        expr: |
          sum by (container_label_com_docker_compose_service, instance) (
            rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service!=""}[1m])
          ) * 100

      # Memory usage percentage per container
      - record: container:memory_usage_percent
        expr: |
          sum by (container_label_com_docker_compose_service, instance) (
            container_memory_working_set_bytes{container_label_com_docker_compose_service!=""}
          ) / sum by (container_label_com_docker_compose_service, instance) (
            container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0
          ) * 100

      # Node CPU usage
      - record: node:cpu_usage_percent
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      # Node memory usage
      - record: node:memory_usage_percent
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      # Disk usage percentage
      - record: node:disk_usage_percent
        expr: |
          100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / 
          node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100)

  - name: application_metrics
    interval: 30s
    rules:
      # Request rate per service
      - record: service:http_requests:rate1m
        expr: |
          sum by (service, method, status) (
            rate(http_requests_total[1m])
          )

      # Request duration 95th percentile
      - record: service:http_request_duration_p95:1m
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (
              rate(http_request_duration_seconds_bucket[1m])
            )
          )

      # Request duration 99th percentile
      - record: service:http_request_duration_p99:1m
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (
              rate(http_request_duration_seconds_bucket[1m])
            )
          )

      # Error rate per service
      - record: service:http_error_rate:1m
        expr: |
          sum by (service) (
            rate(http_requests_total{status=~"5.."}[1m])
          ) / sum by (service) (
            rate(http_requests_total[1m])
          )

  - name: database_metrics
    interval: 30s
    rules:
      # Active database connections
      - record: postgres:active_connections
        expr: |
          sum by (instance) (pg_stat_activity_count{state="active"})

      # Database connection usage percentage
      - record: postgres:connection_usage_percent
        expr: |
          (sum by (instance) (pg_stat_activity_count) / 
          sum by (instance) (pg_settings_max_connections)) * 100

      # Database transactions per second
      - record: postgres:transactions:rate1m
        expr: |
          sum by (datname) (rate(pg_stat_database_xact_commit[1m])) +
          sum by (datname) (rate(pg_stat_database_xact_rollback[1m]))

      # Database query time 95th percentile
      - record: postgres:query_duration_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(pg_stat_statements_total_time_bucket[5m])
            )
          )

  - name: cache_metrics
    interval: 30s
    rules:
      # Redis memory usage percentage
      - record: redis:memory_usage_percent
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) * 100

      # Redis hit rate
      - record: redis:hit_rate:1m
        expr: |
          sum(rate(redis_keyspace_hits_total[1m])) / 
          (sum(rate(redis_keyspace_hits_total[1m])) + sum(rate(redis_keyspace_misses_total[1m])))

      # Redis operations per second
      - record: redis:ops:rate1m
        expr: |
          sum by (instance) (rate(redis_commands_processed_total[1m]))

  - name: queue_metrics
    interval: 30s
    rules:
      # Total messages in queues
      - record: rabbitmq:queue_messages_total
        expr: |
          sum by (queue) (rabbitmq_queue_messages)

      # Message publish rate
      - record: rabbitmq:messages_published:rate1m
        expr: |
          sum by (queue) (rate(rabbitmq_queue_messages_published_total[1m]))

      # Message consume rate
      - record: rabbitmq:messages_consumed:rate1m
        expr: |
          sum by (queue) (rate(rabbitmq_queue_messages_delivered_total[1m]))

      # Consumer utilization
      - record: rabbitmq:consumer_utilization
        expr: |
          sum by (queue) (rabbitmq_queue_consumer_utilisation)

  - name: business_metrics
    interval: 1m
    rules:
      # Total jobs scraped per hour
      - record: business:jobs_scraped:rate1h
        expr: |
          sum by (platform) (rate(jobs_scraped_total[1h]))

      # Job scrape success rate
      - record: business:scrape_success_rate:1h
        expr: |
          sum by (platform) (rate(jobs_scraped_total{status="success"}[1h])) /
          sum by (platform) (rate(jobs_scraped_total[1h]))

      # Active scraping sessions
      - record: business:active_scraping_sessions
        expr: |
          sum by (platform) (scraping_sessions_active)

      # Circuit breaker open count
      - record: business:circuit_breaker_open
        expr: |
          sum by (service, circuit) (circuit_breaker_state{state="open"})
