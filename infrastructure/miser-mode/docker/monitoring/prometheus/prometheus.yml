global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ghost-platform-miser'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'recording-rules.yml'
  - 'alerting-rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'monitoring'

  # Node Exporter for host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'
          instance: 'miser-host'

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'infrastructure'

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          component: 'database'
          service: 'postgresql'

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          component: 'cache'
          service: 'redis'

  # RabbitMQ Exporter
  - job_name: 'rabbitmq-exporter'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          component: 'queue'
          service: 'rabbitmq'

  # Ghost API Service
  - job_name: 'ghost-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          component: 'application'
          service: 'ghost-api'

  # Ghost Scraper Service
  - job_name: 'ghost-scraper'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['scraper:3001']
        labels:
          component: 'application'
          service: 'ghost-scraper'

  # Ghost AI Service
  - job_name: 'ghost-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai:3002']
        labels:
          component: 'application'
          service: 'ghost-ai'

  # Ghost Auth Service
  - job_name: 'ghost-auth'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth:3003']
        labels:
          component: 'application'
          service: 'ghost-auth'

  # Nginx Exporter
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          component: 'infrastructure'
          service: 'nginx'

  # Blackbox Exporter for endpoint monitoring
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/health
          - http://api:3000/health
          - http://scraper:3001/health
          - http://ai:3002/health
          - http://auth:3003/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
