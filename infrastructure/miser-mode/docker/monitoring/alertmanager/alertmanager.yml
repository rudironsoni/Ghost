global:
  resolve_timeout: 5m
  smtp_from: 'alertmanager@ghost-platform.local'
  smtp_smarthost: 'smtp.example.com:587'
  smtp_auth_username: 'alertmanager@ghost-platform.local'
  smtp_auth_password: 'your-smtp-password'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for notifications
route:
  group_by: ['alertname', 'cluster', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 4h

    # Infrastructure alerts
    - match:
        component: infrastructure
      receiver: 'infrastructure-team'
      group_interval: 5m

    # Database alerts
    - match:
        component: database
      receiver: 'database-team'
      group_interval: 5m

    # Application alerts
    - match:
        component: application
      receiver: 'application-team'
      group_interval: 5m

    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 24h

# Inhibit rules to reduce notification noise
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit service-specific alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']

  # Inhibit database-specific alerts if database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match:
      component: 'database'

  # Inhibit cache-specific alerts if cache is down
  - source_match:
      alertname: 'RedisDown'
    target_match:
      component: 'cache'

  # Inhibit queue-specific alerts if queue is down
  - source_match:
      alertname: 'RabbitMQDown'
    target_match:
      component: 'queue'

# Receivers configuration
receivers:
  # Default receiver
  - name: 'default-receiver'
    email_configs:
      - to: 'ops-team@ghost-platform.local'
        headers:
          Subject: '[Ghost Platform] Alert: {{ .GroupLabels.alertname }}'
        html: |
          <!DOCTYPE html>
          <html>
          <body>
            <h2>Ghost Platform Alert</h2>
            <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
            <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
            <p><strong>Component:</strong> {{ .CommonLabels.component }}</p>
            {{ range .Alerts }}
            <hr>
            <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
            <p><strong>Description:</strong> {{ .Annotations.description }}</p>
            <p><strong>Started:</strong> {{ .StartsAt }}</p>
            {{ end }}
          </body>
          </html>

  # Critical alerts receiver
  - name: 'critical-alerts'
    email_configs:
      - to: 'ops-team@ghost-platform.local,on-call@ghost-platform.local'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] Ghost Platform: {{ .GroupLabels.alertname }}'
        html: |
          <!DOCTYPE html>
          <html>
          <body style="font-family: Arial, sans-serif;">
            <div style="background-color: #dc3545; color: white; padding: 20px;">
              <h1>🚨 CRITICAL ALERT 🚨</h1>
            </div>
            <div style="padding: 20px;">
              <h2>{{ .GroupLabels.alertname }}</h2>
              <p><strong>Severity:</strong> <span style="color: #dc3545;">CRITICAL</span></p>
              <p><strong>Component:</strong> {{ .CommonLabels.component }}</p>
              {{ range .Alerts }}
              <hr>
              <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
              <p><strong>Description:</strong> {{ .Annotations.description }}</p>
              <p><strong>Started:</strong> {{ .StartsAt }}</p>
              <p><strong>Labels:</strong></p>
              <ul>
              {{ range .Labels.SortedPairs }}
                <li><strong>{{ .Name }}:</strong> {{ .Value }}</li>
              {{ end }}
              </ul>
              {{ end }}
            </div>
          </body>
          </html>

  # Infrastructure team receiver
  - name: 'infrastructure-team'
    email_configs:
      - to: 'infra-team@ghost-platform.local'
        send_resolved: true
        headers:
          Subject: '[Infrastructure] Ghost Platform: {{ .GroupLabels.alertname }}'

  # Database team receiver
  - name: 'database-team'
    email_configs:
      - to: 'db-team@ghost-platform.local'
        send_resolved: true
        headers:
          Subject: '[Database] Ghost Platform: {{ .GroupLabels.alertname }}'

  # Application team receiver
  - name: 'application-team'
    email_configs:
      - to: 'app-team@ghost-platform.local'
        send_resolved: true
        headers:
          Subject: '[Application] Ghost Platform: {{ .GroupLabels.alertname }}'

  # Warning alerts receiver
  - name: 'warning-alerts'
    email_configs:
      - to: 'ops-team@ghost-platform.local'
        send_resolved: true
        headers:
          Subject: '[Warning] Ghost Platform: {{ .GroupLabels.alertname }}'
