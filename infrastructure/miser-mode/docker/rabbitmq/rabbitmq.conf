# RabbitMQ Configuration - Ultra Miser Mode
# Optimized for single-node deployment with resource constraints

# ============================================================================
# NETWORKING
# ============================================================================

# Listen on all interfaces
listeners.tcp.default = 5672
management.tcp.port = 15672
management.ssl.port = 15671

# Disable IPv6 if not needed
# listeners.tcp.default = 0.0.0.0:5672

# ============================================================================
# MEMORY AND RESOURCE LIMITS
# ============================================================================

# Limit memory usage (set to 75% of container limit)
vm_memory_high_watermark.relative = 0.75

# Absolute limit (useful for containers)
# vm_memory_high_watermark.absolute = 768MB

# Disk free space limit (stop accepting messages when disk is full)
disk_free_limit.absolute = 2GB

# Erlang VM settings for memory optimization
erlang.async_threads = 128
erlang.max_ports = 4096

# ============================================================================
# QUEUE AND MESSAGE SETTINGS
# ============================================================================

# Maximum message size
max_message_size = 16777216

# Queue master locator (for quorum queues)
queue_master_locator = min-masters

# Lazy queues (messages stored on disk)
queue_lazy = true

# ============================================================================
# PERSISTENCE AND DURABILITY
# ============================================================================

# Message store settings
msg_store_file_size_limit = 16777216
msg_store_credit_disc_bound = {4000, 800}

# Mnesia settings (for single node, reduce table copies)
cluster_partition_handling = ignore

# ============================================================================
# LOGGING
# ============================================================================

log.console = true
log.console.level = info
log.console.formatter = json

# File logging (disabled in favor of stdout for containers)
log.file = false

# ============================================================================
# CONNECTION LIMITS
# ============================================================================

# Maximum connections
# max_connections = 1024

# Maximum channels per connection
# max_channels = 128

# Heartbeat (in seconds)
heartbeat = 60

# Connection handshake timeout
handshake_timeout = 10000

# ============================================================================
# SSL/TLS (Optional - configure certificates)
# ============================================================================

# ssl_options.cacertfile = /etc/rabbitmq/ssl/ca_certificate.pem
# ssl_options.certfile = /etc/rabbitmq/ssl/server_certificate.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = false

# ============================================================================
# PLUGINS
# ============================================================================

# Load management plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Enable additional plugins
# rabbitmq_prometheus
# rabbitmq_shovel
# rabbitmq_shovel_management
# rabbitmq_federation
# rabbitmq_federation_management