# Ghost Platform - Ultra Miser Mode
# Single-node deployment optimized for cost ($0-$15/month)
# Maintains architectural integrity while minimizing infrastructure costs
# 
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. docker-compose up -d
#   3. Access API: http://localhost:8080
#   4. Access RabbitMQ Management: http://localhost:15672 (guest/guest)
#   5. Access Grafana: http://localhost:3000 (admin/admin)

version: '3.8'

services:
  # ============================================================================
  # DATABASE LAYER - PostgreSQL
  # Optimized for 2GB RAM allocation
  # ============================================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: ghost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghost
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ghost123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./backups/postgres:/backups
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100
      -c logging_collector=on
      -c log_destination=stderr
      -c log_statement=mod
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - ghost-network

  # ============================================================================
  # CACHE LAYER - Redis
  # Single instance with AOF persistence
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: ghost-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
      --timeout 0
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - ghost-network

  # ============================================================================
  # MESSAGE BROKER - RabbitMQ
  # Single node with management plugin
  # ============================================================================
  
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ghost-rabbitmq
    restart: unless-stopped
    hostname: ghost-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ghost}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ghost123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:-ghost-secret-cookie}
      RABBITMQ_NODENAME: rabbit@ghost-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
      - "15692:15692"   # Prometheus metrics
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - ghost-network

  # ============================================================================
  # APPLICATION - Ghost WebApi
  # Monolithic deployment with all services
  # ============================================================================
  
  ghost-webapi:
    build:
      context: ../../..  # From infrastructure/miser-mode/docker to root
      dockerfile: src/Ghost.WebApi/Dockerfile
    container_name: ghost-webapi
    restart: unless-stopped
    environment:
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      
      # Database
      ConnectionStrings__Postgres: Host=postgres;Database=ghost;Username=ghost;Password=${DB_PASSWORD:-ghost123}
      ConnectionStrings__Redis: redis:6379
      
      # RabbitMQ
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-ghost}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-ghost123}
      RabbitMQ__VirtualHost: /
      
      # Application Configuration
      Ghost__Kernel__Headless: "true"
      Ghost__Kernel__MaxConcurrentSessions: "5"
      Ghost__Kernel__StealthEnabled: "true"
      
      # Resilience Configuration
      Resilience__CircuitBreaker__FailureThreshold: "5"
      Resilience__CircuitBreaker__SuccessThreshold: "2"
      Resilience__CircuitBreaker__OpenTimeoutSeconds: "60"
      Resilience__CircuitBreaker__HalfOpenTimeoutSeconds: "30"
      
      # Platform Enablement (configure via .env)
      Ghost__Extensions__LinkedIn__Enabled: ${LINKEDIN_ENABLED:-false}
      Ghost__Extensions__LinkedIn__Country: ${LINKEDIN_COUNTRY:-US}
      Ghost__Extensions__Indeed__Enabled: ${INDEED_ENABLED:-false}
      Ghost__Extensions__Indeed__Country: ${INDEED_COUNTRY:-US}
      Ghost__Extensions__Glassdoor__Enabled: ${GLASSDOOR_ENABLED:-false}
      Ghost__Extensions__Google__Enabled: ${GOOGLE_ENABLED:-false}
      Ghost__Extensions__InfoJobs__Enabled: ${INFOJOBS_ENABLED:-false}
      
      # Resource Limits
      DOTNET_GCHeapCount: "3"
      DOTNET_GCTotalPhysicalMemory: "3000000000"
      
      # Monitoring
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ghost-webapi
    ports:
      - "8080:8080"
    volumes:
      - ghost-data:/app/data
      - ghost-cache:/var/ghost/cache
      - ghost-dlq:/var/ghost/dlq
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '3.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    networks:
      - ghost-network

  # ============================================================================
  # REVERSE PROXY - Nginx
  # Handles SSL termination and load balancing
  # ============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: ghost-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      ghost-webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    networks:
      - ghost-network

  # ============================================================================
  # MONITORING - Prometheus
  # Self-hosted metrics collection
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: ghost-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--log.level=info'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - ghost-network

  # ============================================================================
  # MONITORING - Grafana
  # Self-hosted dashboards
  # ============================================================================
  
  grafana:
    image: grafana/grafana:latest
    container_name: ghost-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    networks:
      - ghost-network

  # ============================================================================
  # BACKUP SERVICE
  # Automated daily backups to local storage
  # ============================================================================
  
  backup:
    image: offen/docker-volume-backup:latest
    container_name: ghost-backup
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "0 2 * * *"  # Daily at 2 AM
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_FILENAME: "backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_ARCHIVE: "/archive"
      BACKUP_STOP_CONTAINER_LABEL: ghost.stop-during-backup=true
      BACKUP_FROM_SNAPSHOT: "true"
      BACKUP_PRUNING_PREFIX: "backup-"
      AWS_S3_BUCKET_NAME: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_KEY:-}
      AWS_ENDPOINT: ${S3_ENDPOINT:-s3.amazonaws.com}
      AWS_S3_PATH: ghost-backups
    volumes:
      - postgres_data:/backup/postgres:ro
      - redis_data:/backup/redis:ro
      - rabbitmq_data:/backup/rabbitmq:ro
      - ghost-data:/backup/ghost-data:ro
      - ./backups:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    networks:
      - ghost-network

  # ============================================================================
  # LOG AGGREGATION - Fluent Bit (Optional)
  # Lightweight log shipping
  # ============================================================================
  
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: ghost-fluent-bit
    restart: unless-stopped
    volumes:
      - ./logs:/logs:ro
      - ./monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - ghost-webapi
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    networks:
      - ghost-network
    profiles:
      - logging  # Only start with: docker-compose --profile logging up

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  ghost-data:
    driver: local
  ghost-cache:
    driver: local
  ghost-dlq:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  ghost-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16