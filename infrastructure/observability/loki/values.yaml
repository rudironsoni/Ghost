# Loki Helm Values for Ghost Enterprise Observability
# Chart: grafana/loki-distributed

nameOverride: ghost-loki
fullnameOverride: ghost-loki

## Loki configuration
loki:
  # Configuration as code
  config: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
      
    distributor:
      ring:
        kvstore:
          store: memberlist
    
    memberlist:
      join_members:
        - ghost-loki-memberlist
    
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 2
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      max_chunk_age: 1h
      chunk_target_size: 1048576
      chunk_encoding: snappy
      wal:
        enabled: true
        dir: /loki/wal
        replay_memory_ceiling: 4GB
    
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: s3
          schema: v11
          index:
            prefix: loki_index_
            period: 24h
    
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
        shared_store: s3
      
      aws:
        s3: s3://us-east-1/ghost-loki-chunks
        s3forcepathstyle: true
        # For MinIO or compatible S3
        # endpoint: minio.storage.svc.cluster.local:9000
        # insecure: true
        # access_key_id: ${AWS_ACCESS_KEY_ID}
        # secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      
      # Alternative: filesystem storage for testing
      # filesystem:
      #   directory: /loki/chunks
    
    compactor:
      working_directory: /loki/compactor
      shared_store: s3
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_label_name_length: 1024
      max_label_value_length: 2048
      max_label_names_per_series: 30
      max_entries_limit_per_query: 5000
      max_streams_per_user: 10000
      max_global_streams_per_user: 0
      max_chunks_per_query: 2000000
      max_query_length: 721h
      max_query_parallelism: 32
      retention_period: 744h  # 31 days
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB
      cardinality_limit: 100000
    
    chunk_store_config:
      max_look_back_period: 744h
      chunk_cache_config:
        memcached:
          batch_size: 100
          parallelism: 100
        memcached_client:
          consistent_hash: true
          host: memcached.monitoring.svc.cluster.local
          service: memcached
    
    query_range:
      align_queries_with_step: true
      max_retries: 5
      cache_results: true
      results_cache:
        cache:
          memcached_client:
            consistent_hash: true
            host: memcached.monitoring.svc.cluster.local
            service: memcached
            timeout: 500ms
    
    frontend:
      log_queries_longer_than: 5s
      compress_responses: true
      max_outstanding_per_tenant: 2048
    
    query_scheduler:
      max_outstanding_requests_per_tenant: 2048
    
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp
      alertmanager_url: http://ghost-prometheus-alertmanager.monitoring.svc.cluster.local:9093
      ring:
        kvstore:
          store: memberlist
      enable_api: true
      enable_alertmanager_v2: true
  
  # Structured config (alternative to config string)
  structuredConfig: {}

## Components configuration
ingester:
  replicas: 3
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: fast-ssd
  
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: ingester
        topologyKey: kubernetes.io/hostname

distributor:
  replicas: 3
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: distributor
          topologyKey: kubernetes.io/hostname

querier:
  replicas: 3
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: querier
          topologyKey: kubernetes.io/hostname

queryFrontend:
  replicas: 2
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

gateway:
  enabled: true
  replicas: 2
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: loki.ghost.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: loki-tls
        hosts:
          - loki.ghost.example.com

compactor:
  enabled: true
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: fast-ssd

ruler:
  enabled: true
  replicas: 2
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: fast-ssd

indexGateway:
  enabled: true
  replicas: 2
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: fast-ssd

## Memcached for caching
memcached:
  enabled: true
  
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

memcachedExporter:
  enabled: true

memcachedChunks:
  enabled: true
  replicas: 2

memcachedFrontend:
  enabled: true
  replicas: 2

memcachedIndexQueries:
  enabled: true
  replicas: 2

memcachedIndexWrites:
  enabled: true
  replicas: 2

## Service Monitor
serviceMonitor:
  enabled: true
  labels:
    prometheus: ghost-monitoring

## Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: production
      - namespaceSelector:
          matchLabels:
            name: monitoring

## Global settings
global:
  dnsService: coredns
  clusterDomain: cluster.local
