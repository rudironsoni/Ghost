apiVersion: v1
kind: Secret
metadata:
  name: additional-scrape-configs
  namespace: monitoring
type: Opaque
stringData:
  prometheus-additional.yaml: |
    # PostgreSQL Exporter
    - job_name: 'postgres-exporter'
      static_configs:
      - targets:
        - postgres-exporter.production.svc.cluster.local:9187
      relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: postgres-exporter.production.svc.cluster.local:9187
    
    # Redis Exporter
    - job_name: 'redis-exporter'
      static_configs:
      - targets:
        - redis-exporter.production.svc.cluster.local:9121
      relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    
    # RabbitMQ Exporter
    - job_name: 'rabbitmq-exporter'
      static_configs:
      - targets:
        - rabbitmq-exporter.production.svc.cluster.local:9419
      relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'rabbitmq_.*'
        action: keep
    
    # Elasticsearch Exporter (if used)
    - job_name: 'elasticsearch-exporter'
      static_configs:
      - targets:
        - elasticsearch-exporter.production.svc.cluster.local:9114
      relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    
    # Blackbox Exporter for endpoint monitoring
    - job_name: 'blackbox-http'
      metrics_path: /probe
      params:
        module: [http_2xx]
      static_configs:
      - targets:
        - https://ghost.example.com/health
        - https://api.ghost.example.com/health
        - https://admin.ghost.example.com/health
      relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
    
    # Blackbox Exporter for TCP monitoring
    - job_name: 'blackbox-tcp'
      metrics_path: /probe
      params:
        module: [tcp_connect]
      static_configs:
      - targets:
        - postgres.production.svc.cluster.local:5432
        - redis.production.svc.cluster.local:6379
        - rabbitmq.production.svc.cluster.local:5672
      relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
    
    # Custom application metrics endpoints
    - job_name: 'ghost-batch-jobs'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - production
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: ghost
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: batch
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
    
    # Backup job monitoring
    - job_name: 'backup-jobs'
      static_configs:
      - targets:
        - backup-monitor.production.svc.cluster.local:9090
      relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'backup_.*'
        action: keep
    
    # Federation from other Prometheus instances (if applicable)
    # - job_name: 'federate'
    #   scrape_interval: 15s
    #   honor_labels: true
    #   metrics_path: '/federate'
    #   params:
    #     'match[]':
    #       - '{job="ghost-app"}'
    #       - '{__name__=~"job:.*"}'
    #   static_configs:
    #     - targets:
    #       - prometheus-region-2.monitoring.svc.cluster.local:9090
