# Vault Secret Engines Configuration
# This file documents the secret engines used by Ghost application

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-secret-engines-config
  namespace: vault
data:
  # KV v2 Secrets Engine Configuration
  kv-config.json: |
    {
      "path": "secret/",
      "type": "kv",
      "options": {
        "version": "2"
      },
      "description": "Key-Value secrets engine v2 for Ghost application secrets",
      "config": {
        "max_versions": 10,
        "cas_required": false,
        "delete_version_after": "0s"
      }
    }

  # Database Secrets Engine Configuration
  database-config.json: |
    {
      "path": "database/",
      "type": "database",
      "description": "Dynamic database credentials for Ghost MySQL",
      "config": {
        "mysql": {
          "plugin_name": "mysql-database-plugin",
          "connection_url": "{{username}}:{{password}}@tcp(mysql.ghost.svc.cluster.local:3306)/",
          "allowed_roles": ["ghost-app", "ghost-readonly"],
          "username": "vault-admin",
          "password": "VAULT_ADMIN_PASSWORD",
          "max_open_connections": 5,
          "max_idle_connections": 0,
          "max_connection_lifetime": "0s"
        }
      },
      "roles": {
        "ghost-app": {
          "db_name": "ghost-mysql",
          "creation_statements": [
            "CREATE USER '{{name}}'@'%' IDENTIFIED BY '{{password}}';",
            "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER ON ghost.* TO '{{name}}'@'%';"
          ],
          "revocation_statements": [
            "DROP USER '{{name}}'@'%';"
          ],
          "default_ttl": "1h",
          "max_ttl": "24h"
        },
        "ghost-readonly": {
          "db_name": "ghost-mysql",
          "creation_statements": [
            "CREATE USER '{{name}}'@'%' IDENTIFIED BY '{{password}}';",
            "GRANT SELECT ON ghost.* TO '{{name}}'@'%';"
          ],
          "revocation_statements": [
            "DROP USER '{{name}}'@'%';"
          ],
          "default_ttl": "1h",
          "max_ttl": "24h"
        }
      }
    }

  # Transit Secrets Engine Configuration
  transit-config.json: |
    {
      "path": "transit/",
      "type": "transit",
      "description": "Encryption as a service for Ghost application",
      "config": {
        "keys": {
          "ghost-pii": {
            "type": "aes256-gcm96",
            "deletion_allowed": false,
            "exportable": false,
            "allow_plaintext_backup": false,
            "min_decryption_version": 1,
            "min_encryption_version": 0,
            "description": "Encryption key for PII data (emails, names, addresses)"
          },
          "ghost-content": {
            "type": "aes256-gcm96",
            "deletion_allowed": false,
            "exportable": false,
            "allow_plaintext_backup": false,
            "min_decryption_version": 1,
            "min_encryption_version": 0,
            "description": "Encryption key for sensitive content"
          },
          "ghost-tokens": {
            "type": "aes256-gcm96",
            "deletion_allowed": false,
            "exportable": false,
            "allow_plaintext_backup": false,
            "min_decryption_version": 1,
            "min_encryption_version": 0,
            "description": "Encryption key for API tokens and session data"
          }
        }
      }
    }

  # PKI Secrets Engine Configuration
  pki-config.json: |
    {
      "path": "pki/",
      "type": "pki",
      "description": "PKI for internal Ghost service certificates",
      "config": {
        "max_lease_ttl": "87600h",
        "default_lease_ttl": "8760h"
      },
      "root_ca": {
        "common_name": "Ghost Internal Root CA",
        "ttl": "87600h",
        "key_type": "rsa",
        "key_bits": 4096,
        "exclude_cn_from_sans": true
      },
      "urls": {
        "issuing_certificates": "https://vault.ghost.internal/v1/pki/ca",
        "crl_distribution_points": "https://vault.ghost.internal/v1/pki/crl"
      },
      "roles": {
        "ghost-internal": {
          "allowed_domains": [
            "ghost.svc.cluster.local",
            "ghost-production.svc.cluster.local",
            "ghost-staging.svc.cluster.local",
            "*.ghost.internal"
          ],
          "allow_subdomains": true,
          "allow_glob_domains": false,
          "allow_any_name": false,
          "enforce_hostnames": true,
          "allow_ip_sans": true,
          "server_flag": true,
          "client_flag": true,
          "code_signing_flag": false,
          "email_protection_flag": false,
          "key_type": "rsa",
          "key_bits": 2048,
          "use_csr_common_name": false,
          "use_csr_sans": false,
          "max_ttl": "8760h",
          "ttl": "720h",
          "no_store": false,
          "require_cn": true
        }
      }
    }

  # AWS Secrets Engine Configuration (for dynamic AWS credentials)
  aws-config.json: |
    {
      "path": "aws/",
      "type": "aws",
      "description": "Dynamic AWS credentials for Ghost S3/CloudFront access",
      "config": {
        "access_key": "VAULT_AWS_ACCESS_KEY",
        "secret_key": "VAULT_AWS_SECRET_KEY",
        "region": "us-east-1",
        "iam_endpoint": "https://iam.amazonaws.com",
        "sts_endpoint": "https://sts.amazonaws.com",
        "max_retries": 3
      },
      "roles": {
        "ghost-s3-access": {
          "credential_type": "iam_user",
          "policy_document": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:ListBucket",
                  "s3:GetObject",
                  "s3:PutObject",
                  "s3:DeleteObject"
                ],
                "Resource": [
                  "arn:aws:s3:::ghost-content-production/*",
                  "arn:aws:s3:::ghost-content-staging/*"
                ]
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:ListBucket"
                ],
                "Resource": [
                  "arn:aws:s3:::ghost-content-production",
                  "arn:aws:s3:::ghost-content-staging"
                ]
              }
            ]
          },
          "default_sts_ttl": "3600s",
          "max_sts_ttl": "43200s"
        }
      }
    }

  # SSH Secrets Engine Configuration (for server access)
  ssh-config.json: |
    {
      "path": "ssh/",
      "type": "ssh",
      "description": "SSH certificate authority for Ghost infrastructure access",
      "config": {
        "generate_signing_key": true
      },
      "roles": {
        "ghost-admin": {
          "key_type": "ca",
          "allow_user_certificates": true,
          "allowed_users": "*",
          "allowed_extensions": "permit-pty,permit-port-forwarding",
          "default_extensions": {
            "permit-pty": "",
            "permit-port-forwarding": ""
          },
          "ttl": "8h",
          "max_ttl": "24h"
        }
      }
    }

---
# Vault Secrets Structure Documentation
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-secrets-structure
  namespace: vault
data:
  structure.yaml: |
    # Ghost Application Secrets Structure in Vault
    
    # KV v2 Secrets (secret/)
    secret/ghost/:
      # Database connection
      database:
        url: "mysql://user:pass@host:port/db"
        read_replica_url: "mysql://user:pass@replica:port/db"
        ssl_ca: "base64_encoded_ca_cert"
      
      # SMTP Configuration
      smtp:
        host: "smtp.sendgrid.net"
        port: "587"
        user: "apikey"
        password: "SG.xxxxx"
        from_address: "noreply@ghost.com"
      
      # Storage (S3/GCS)
      storage:
        type: "s3"
        bucket: "ghost-content-production"
        region: "us-east-1"
        endpoint: "https://s3.amazonaws.com"
      
      # Email Service (Mailgun/SendGrid)
      email:
        provider: "mailgun"
        api_key: "key-xxxxx"
        domain: "mg.ghost.com"
        base_url: "https://api.mailgun.net/v3"
      
      # Payment Gateway (Stripe)
      payments:
        stripe_secret_key: "sk_live_xxxxx"
        stripe_publishable_key: "pk_live_xxxxx"
        stripe_webhook_secret: "whsec_xxxxx"
      
      # OAuth/SSO
      oauth:
        google_client_id: "xxxxx.apps.googleusercontent.com"
        google_client_secret: "xxxxx"
        github_client_id: "xxxxx"
        github_client_secret: "xxxxx"
      
      # Integration API Keys
      integrations/:
        slack:
          webhook_url: "https://hooks.slack.com/services/xxxxx"
          bot_token: "xoxb-xxxxx"
        datadog:
          api_key: "xxxxx"
          app_key: "xxxxx"
        sentry:
          dsn: "https://xxxxx@sentry.io/xxxxx"
        cloudflare:
          api_token: "xxxxx"
          zone_id: "xxxxx"
      
      # Session/JWT secrets
      sessions:
        jwt_secret: "random-256-bit-secret"
        session_secret: "random-256-bit-secret"
        cookie_signing_key: "random-256-bit-secret"
    
    # Dynamic Database Credentials
    database/creds/:
      ghost-app:  # Short-lived MySQL credentials with write access
      ghost-readonly:  # Short-lived MySQL credentials with read-only access
    
    # Transit Encryption Keys
    transit/encrypt/:
      ghost-pii:  # Encrypt PII data
      ghost-content:  # Encrypt sensitive content
      ghost-tokens:  # Encrypt API tokens
    
    transit/decrypt/:
      ghost-pii:  # Decrypt PII data
      ghost-content:  # Decrypt sensitive content
      ghost-tokens:  # Decrypt API tokens
    
    # PKI Certificates
    pki/issue/:
      ghost-internal:  # Issue internal service certificates
    
    # AWS Dynamic Credentials
    aws/creds/:
      ghost-s3-access:  # Short-lived AWS credentials for S3
    
    # SSH Certificates
    ssh/sign/:
      ghost-admin:  # Sign SSH certificates for admin access
