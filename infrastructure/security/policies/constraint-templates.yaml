# Template: Enforce AppArmor profiles
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spspapparmor
  namespace: gatekeeper-system
  annotations:
    description: "Requires AppArmor profile annotations"
    version: "1.0.0"
spec:
  crd:
    spec:
      names:
        kind: K8sPSPAppArmor
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedProfiles:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spspapparmor

        violation[{"msg": msg}] {
          container := input_containers[_]
          not input_apparmor_allowed(container.name)
          msg := sprintf("Container %v does not have an allowed AppArmor profile", [container.name])
        }

        input_apparmor_allowed(container_name) {
          profile := input.review.object.metadata.annotations[sprintf("container.apparmor.security.beta.kubernetes.io/%v", [container_name])]
          profile == input.parameters.allowedProfiles[_]
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

---
# Template: Enforce resource quotas
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sresourceratio
  namespace: gatekeeper-system
  annotations:
    description: "Enforces resource request/limit ratios"
    version: "1.0.0"
spec:
  crd:
    spec:
      names:
        kind: K8sResourceRatio
      validation:
        openAPIV3Schema:
          type: object
          properties:
            maxRatio:
              type: number
              description: "Maximum ratio of limit to request"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sresourceratio

        violation[{"msg": msg}] {
          container := input_containers[_]
          cpu_ratio := to_number(container.resources.limits.cpu) / to_number(container.resources.requests.cpu)
          cpu_ratio > input.parameters.maxRatio
          msg := sprintf("Container %v CPU limit/request ratio %.2f exceeds maximum %.2f", [container.name, cpu_ratio, input.parameters.maxRatio])
        }

        violation[{"msg": msg}] {
          container := input_containers[_]
          mem_limit := parse_memory(container.resources.limits.memory)
          mem_request := parse_memory(container.resources.requests.memory)
          mem_ratio := mem_limit / mem_request
          mem_ratio > input.parameters.maxRatio
          msg := sprintf("Container %v memory limit/request ratio %.2f exceeds maximum %.2f", [container.name, mem_ratio, input.parameters.maxRatio])
        }

        parse_memory(mem_str) = result {
          endswith(mem_str, "Gi")
          result := to_number(trim_suffix(mem_str, "Gi")) * 1024
        }

        parse_memory(mem_str) = result {
          endswith(mem_str, "Mi")
          result := to_number(trim_suffix(mem_str, "Mi"))
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

---
# ConfigMap: Template deployment guide
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatekeeper-templates-guide
  namespace: gatekeeper-system
  labels:
    app.kubernetes.io/name: gatekeeper
    app.kubernetes.io/component: documentation
data:
  README.md: |
    # OPA Gatekeeper Constraint Templates

    ## Overview

    This file contains all constraint templates used by OPA Gatekeeper for
    enforcing security and operational policies in the Ghost Kubernetes cluster.

    ## Deployment

    Deploy all templates:
    ```bash
    kubectl apply -f constraint-templates.yaml
    ```

    Verify templates are installed:
    ```bash
    kubectl get constrainttemplates
    ```

    ## Available Templates

    ### Security Templates
    - **K8sPSPPrivilegedContainer**: Block privileged containers
    - **K8sPSPHostNamespace**: Block host namespace usage
    - **K8sPSPReadOnlyRootFilesystem**: Require read-only root filesystem
    - **K8sPSPAllowPrivilegeEscalationContainer**: Block privilege escalation
    - **K8sPSPRunAsNonRoot**: Require non-root user
    - **K8sPSPHostFilesystem**: Block host path volumes
    - **K8sPSPCapabilities**: Control Linux capabilities
    - **K8sPSPHostPorts**: Block host port usage
    - **K8sPSPSeccomp**: Enforce seccomp profiles
    - **K8sPSPAppArmor**: Enforce AppArmor profiles

    ### Operational Templates
    - **K8sRequiredLabels**: Require specific labels
    - **K8sRequiredResources**: Require resource requests/limits
    - **K8sAllowedRepos**: Restrict container registries
    - **K8sBlockLatestImages**: Block :latest tag
    - **K8sResourceRatio**: Enforce resource ratios

    ## Creating Constraints

    After deploying templates, create constraints to enforce policies:

    ```yaml
    apiVersion: constraints.gatekeeper.sh/v1beta1
    kind: K8sPSPPrivilegedContainer
    metadata:
      name: block-privileged-containers
    spec:
      enforcementAction: deny
      match:
        kinds:
          - apiGroups: [""]
            kinds: ["Pod"]
    ```

    ## Enforcement Actions

    - **deny**: Block resource creation (recommended for production)
    - **dryrun**: Log violations without blocking
    - **warn**: Allow creation but log warning

    ## Testing

    Test policies before enforcing:
    ```bash
    # Deploy with dryrun mode
    kubectl apply -f test-constraint.yaml

    # Check audit violations
    kubectl get constraint <constraint-name> -o yaml

    # Review violations in status
    kubectl describe constraint <constraint-name>
    ```

    ## Monitoring

    View all constraints:
    ```bash
    kubectl get constraints --all-namespaces
    ```

    Check violations:
    ```bash
    kubectl get <constraint-kind> <constraint-name> -o jsonpath='{.status.violations}'
    ```

    ## Troubleshooting

    ### Template not found
    Ensure templates are deployed before constraints:
    ```bash
    kubectl get constrainttemplates
    ```

    ### Constraint not enforcing
    Check enforcement action and match criteria:
    ```bash
    kubectl get constraint <name> -o yaml
    ```

    ### False positives
    Use namespace exclusions or adjust match criteria in constraints.

    ## Documentation

    - OPA Gatekeeper: https://open-policy-agent.github.io/gatekeeper/
    - Rego Language: https://www.openpolicyagent.org/docs/latest/policy-language/
    - Kubernetes PSP: https://kubernetes.io/docs/concepts/policy/pod-security-policy/
