---
apiVersion: v1
kind: Service
metadata:
  name: ghost-webapi
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: ghost-platform
    tier: backend
  annotations:
    description: "Ghost WebAPI ClusterIP service"
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # For AWS NLB
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800 # 3 hours
  
  selector:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: api
  
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: metrics
  
  # IP Family Policy (for dual-stack support)
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
  - IPv4
  - IPv6
---
apiVersion: v1
kind: Service
metadata:
  name: ghost-webapi-headless
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: ghost-platform
    tier: backend
    service-type: headless
  annotations:
    description: "Ghost WebAPI headless service for StatefulSet or direct pod access"
spec:
  type: ClusterIP
  clusterIP: None # Headless service
  
  selector:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: api
  
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: metrics
  
  publishNotReadyAddresses: true # Include not-ready pods in DNS
---
