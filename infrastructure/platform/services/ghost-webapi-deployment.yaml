---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-webapi
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ghost-platform
    app.kubernetes.io/version: "1.0.0"
    tier: backend
  annotations:
    description: "Ghost WebAPI deployment with rolling updates"
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost-webapi
      app.kubernetes.io/component: api
  
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghost-webapi
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ghost-platform
        app.kubernetes.io/version: "1.0.0"
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
        checksum/secret: "{{ include (print $.Template.BasePath \"/secret.yaml\") . | sha256sum }}"
    
    spec:
      # Service Account
      serviceAccountName: ghost-webapi
      
      # Security Context (Pod level)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Affinity Rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - ghost-webapi
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - m5.large
                - m5.xlarge
      
      # Topology Spread Constraints
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: ghost-webapi
      
      # Init Containers
      initContainers:
      - name: wait-for-database
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for database to be ready..."
          until nc -z -v -w30 $DB_HOST $DB_PORT; do
            echo "Waiting for database connection..."
            sleep 5
          done
          echo "Database is ready!"
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ghost-config
              key: database.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: ghost-config
              key: database.port
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      
      # Main Container
      containers:
      - name: ghost-webapi
        image: ghost-webapi:latest # Replace with actual image
        imagePullPolicy: Always
        
        # Ports
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Environment Variables
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # Environment from ConfigMap
        envFrom:
        - configMapRef:
            name: ghost-config
        - secretRef:
            name: ghost-secrets
        
        # Resource Limits
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 2Gi
        
        # Security Context (Container level)
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        
        # Health Checks
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
        
        # Volume Mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-cache
          mountPath: /app/cache
        - name: app-logs
          mountPath: /app/logs
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: app-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: app-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: config-volume
        configMap:
          name: ghost-config
          defaultMode: 0444
      
      # DNS Configuration
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
        - name: ndots
          value: "2"
        - name: edns0
      
      # Termination Grace Period
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghost-webapi
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: ghost-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghost-webapi-role
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: ghost-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghost-webapi-rolebinding
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: ghost-platform
subjects:
- kind: ServiceAccount
  name: ghost-webapi
  namespace: ghost
roleRef:
  kind: Role
  name: ghost-webapi-role
  apiGroup: rbac.authorization.k8s.io
