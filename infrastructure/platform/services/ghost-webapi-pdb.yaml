---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ghost-webapi-pdb
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost-webapi
    app.kubernetes.io/component: pdb
    app.kubernetes.io/part-of: ghost-platform
  annotations:
    description: "Pod Disruption Budget to ensure high availability during voluntary disruptions"
spec:
  # Minimum number of pods that must be available during disruption
  minAvailable: 2
  
  # Alternative: Maximum number of pods that can be unavailable
  # maxUnavailable: 1
  
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost-webapi
      app.kubernetes.io/component: api
  
  # Unhealthy pod eviction policy (Kubernetes 1.26+)
  unhealthyPodEvictionPolicy: IfHealthyBudget
---
