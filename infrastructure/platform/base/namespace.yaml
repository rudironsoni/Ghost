---
apiVersion: v1
kind: Namespace
metadata:
  name: ghost
  labels:
    name: ghost
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: ghost-platform
    environment: production
  annotations:
    description: "Ghost Platform namespace for all Ghost CMS services"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ghost-compute-quota
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: resource-quota
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services: "20"
    secrets: "50"
    configmaps: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ghost-limit-range
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: limit-range
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    type: Container
  - max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: 100m
      memory: 128Mi
    type: Pod
