#cloud-config
# ============================================================================
# Cloud-Init Configuration for k3s Node
# ============================================================================
# This configuration:
# - Installs k3s (lightweight Kubernetes)
# - Installs Docker and docker-compose (for self-hosted services)
# - Installs CloudWatch agent
# - Configures system for Ghost Platform
# - Sets up RabbitMQ container (if self-hosted)
# ============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - jq
  - unzip
  - htop
  - vim
  - tmux
  - amazon-cloudwatch-agent
  - docker
  - postgresql15-client

runcmd:
  # ============================================================================
  # SYSTEM SETUP
  # ============================================================================
  
  # Set hostname
  - hostnamectl set-hostname ${project}-${environment}-k3s
  
  # Configure timezone
  - timedatectl set-timezone UTC
  
  # ============================================================================
  # DOCKER SETUP
  # ============================================================================
  
  # Start and enable Docker
  - systemctl enable docker
  - systemctl start docker
  
  # Add ec2-user to docker group
  - usermod -aG docker ec2-user
  
  # Install docker-compose
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  
  # ============================================================================
  # K3S INSTALLATION
  # ============================================================================
  
  # Install k3s (lightweight Kubernetes)
  - curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
  
  # Wait for k3s to be ready
  - until kubectl get nodes; do sleep 5; done
  
  # Configure kubectl for ec2-user
  - mkdir -p /home/ec2-user/.kube
  - cp /etc/rancher/k3s/k3s.yaml /home/ec2-user/.kube/config
  - chown -R ec2-user:ec2-user /home/ec2-user/.kube
  
  # ============================================================================
  # HELM INSTALLATION
  # ============================================================================
  
  # Install Helm
  - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  
  # ============================================================================
  # ENVIRONMENT VARIABLES SETUP
  # ============================================================================
  
  # Create environment file with service connections
  - |
    cat > /etc/environment.d/ghost.conf <<EOF
    ENVIRONMENT=${environment}
    PROJECT=${project}
    
    # Database
    DB_HOST=${db_host}
    DB_PORT=${db_port}
    DB_NAME=${db_name}
    DB_USER=${db_username}
    
    # Redis
    REDIS_HOST=${redis_host}
    REDIS_PORT=${redis_port}
    
    # RabbitMQ
    MQ_HOST=${mq_host}
    MQ_USER=${mq_username}
    EOF
  
  # Create secrets file (restricted permissions)
  - |
    cat > /etc/ghost-secrets.env <<EOF
    DB_PASSWORD=${db_password}
    MQ_PASSWORD=${mq_password}
    EOF
  - chmod 600 /etc/ghost-secrets.env
  
  # ============================================================================
  # SELF-HOSTED RABBITMQ (if not using Amazon MQ)
  # ============================================================================
  
  # Deploy RabbitMQ on k3s
  - |
    if [ "${mq_host}" = "localhost" ]; then
      kubectl create namespace rabbitmq
      
      # Create RabbitMQ ConfigMap
      cat <<EOYAML | kubectl apply -f -
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: rabbitmq-config
      namespace: rabbitmq
    data:
      rabbitmq.conf: |
        loopback_users.guest = false
        listeners.tcp.default = 5672
        management.tcp.port = 15672
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: rabbitmq-secret
      namespace: rabbitmq
    type: Opaque
    stringData:
      username: ${mq_username}
      password: ${mq_password}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: rabbitmq
      namespace: rabbitmq
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: rabbitmq
      template:
        metadata:
          labels:
            app: rabbitmq
        spec:
          containers:
          - name: rabbitmq
            image: rabbitmq:3.11-management-alpine
            ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
            volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: data
              mountPath: /var/lib/rabbitmq
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: config
            configMap:
              name: rabbitmq-config
          - name: data
            emptyDir: {}
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: rabbitmq
      namespace: rabbitmq
    spec:
      type: NodePort
      ports:
      - port: 5672
        targetPort: 5672
        name: amqp
        nodePort: 30672
      - port: 15672
        targetPort: 15672
        name: management
        nodePort: 30673
      selector:
        app: rabbitmq
    EOYAML
    fi
  
  # ============================================================================
  # CLOUDWATCH AGENT CONFIGURATION
  # ============================================================================
  
  - |
    cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<EOF
    {
      "agent": {
        "metrics_collection_interval": 60,
        "run_as_user": "cwagent"
      },
      "logs": {
        "logs_collected": {
          "files": {
            "collect_list": [
              {
                "file_path": "/var/log/messages",
                "log_group_name": "/aws/ec2/${project}-${environment}/k3s",
                "log_stream_name": "{instance_id}/messages"
              },
              {
                "file_path": "/var/log/k3s.log",
                "log_group_name": "/aws/ec2/${project}-${environment}/k3s",
                "log_stream_name": "{instance_id}/k3s"
              }
            ]
          }
        }
      },
      "metrics": {
        "namespace": "Ghost/${environment}",
        "metrics_collected": {
          "cpu": {
            "measurement": [
              {
                "name": "cpu_usage_idle",
                "rename": "CPU_IDLE",
                "unit": "Percent"
              }
            ],
            "metrics_collection_interval": 60,
            "totalcpu": false
          },
          "disk": {
            "measurement": [
              {
                "name": "used_percent",
                "rename": "DISK_USED",
                "unit": "Percent"
              }
            ],
            "metrics_collection_interval": 60,
            "resources": [
              "*"
            ]
          },
          "mem": {
            "measurement": [
              {
                "name": "mem_used_percent",
                "rename": "MEM_USED",
                "unit": "Percent"
              }
            ],
            "metrics_collection_interval": 60
          }
        }
      }
    }
    EOF
  
  # Start CloudWatch agent
  - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
  
  # ============================================================================
  # INSTALL KUBECTL PLUGINS
  # ============================================================================
  
  # Install kubectx and kubens
  - git clone https://github.com/ahmetb/kubectx /opt/kubectx
  - ln -s /opt/kubectx/kubectx /usr/local/bin/kubectx
  - ln -s /opt/kubectx/kubens /usr/local/bin/kubens
  
  # ============================================================================
  # SYSTEM TUNING
  # ============================================================================
  
  # Increase file descriptor limits
  - |
    cat >> /etc/security/limits.conf <<EOF
    * soft nofile 65536
    * hard nofile 65536
    EOF
  
  # Kernel parameter tuning for k3s
  - |
    cat >> /etc/sysctl.d/99-k3s.conf <<EOF
    net.ipv4.ip_forward = 1
    net.bridge.bridge-nf-call-iptables = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    vm.swappiness = 0
    EOF
  - sysctl -p /etc/sysctl.d/99-k3s.conf
  
  # ============================================================================
  # MOTD (Message of the Day)
  # ============================================================================
  
  - |
    cat > /etc/motd <<'EOF'
    
    ╔═══════════════════════════════════════════════════════════════════╗
    ║                                                                   ║
    ║              👻 Ghost Platform - Development Environment          ║
    ║                                                                   ║
    ╚═══════════════════════════════════════════════════════════════════╝
    
    Environment: ${environment}
    Node Type: k3s single-node cluster
    
    Quick Commands:
    ---------------
    kubectl get nodes                    # Check cluster status
    kubectl get pods -A                  # View all pods
    kubectl get svc -A                   # View all services
    helm list -A                         # List Helm releases
    
    Service Connections:
    -------------------
    Database:  ${db_host}:${db_port}
    Redis:     ${redis_host}:${redis_port}
    RabbitMQ:  ${mq_host}
    
    Useful Paths:
    ------------
    Kubeconfig:     /etc/rancher/k3s/k3s.yaml
    Environment:    /etc/environment.d/ghost.conf
    Secrets:        /etc/ghost-secrets.env (restricted)
    
    Documentation:
    -------------
    Infrastructure: /home/ec2-user/Ghost/infrastructure/docs
    Platform:       /home/ec2-user/Ghost/infrastructure/platform
    
    ⚠️  This is a DEVELOPMENT environment - not for production use!
    
    EOF

write_files:
  # Create a systemd service for automatic updates check
  - path: /etc/systemd/system/ghost-health-check.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Ghost Platform Health Check
      After=network.target k3s.service
      
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/ghost-health-check.sh
      
      [Install]
      WantedBy=multi-user.target
  
  - path: /usr/local/bin/ghost-health-check.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Simple health check script
      
      echo "=== Ghost Platform Health Check ==="
      echo "Timestamp: $(date)"
      
      # Check k3s
      if systemctl is-active --quiet k3s; then
        echo "✓ k3s is running"
      else
        echo "✗ k3s is NOT running"
      fi
      
      # Check Docker
      if systemctl is-active --quiet docker; then
        echo "✓ Docker is running"
      else
        echo "✗ Docker is NOT running"
      fi
      
      # Check database connectivity
      if pg_isready -h ${db_host} -p ${db_port} -U ${db_username} > /dev/null 2>&1; then
        echo "✓ Database is reachable"
      else
        echo "✗ Database is NOT reachable"
      fi
      
      # Check disk usage
      DISK_USAGE=$(df -h / | awk 'NR==2 {print $5}' | sed 's/%//')
      if [ "$DISK_USAGE" -lt 80 ]; then
        echo "✓ Disk usage is acceptable ($DISK_USAGE%)"
      else
        echo "⚠ Disk usage is high ($DISK_USAGE%)"
      fi
      
      echo "==================================="

final_message: |
  Ghost Platform k3s node is ready!
  
  Connect via: ssh ec2-user@$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
  
  Check status: kubectl get nodes
