apiVersion: v1
kind: Secret
metadata:
  name: ghost-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
type: Opaque
stringData:
  # These should be overridden with actual secrets via Sealed Secrets or External Secrets
  mail__options__auth__user: "smtp-user@example.com"
  mail__options__auth__pass: "changeme"
  mail__options__host: "smtp.example.com"
  mail__options__port: "587"
