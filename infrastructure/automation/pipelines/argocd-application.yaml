apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost-cms
  namespace: argocd
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/part-of: ghost-platform
    managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    notifications.argoproj.io/subscribe.on-deployed.slack: ghost-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: ghost-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ghost-production

  # Source configuration
  source:
    repoURL: https://github.com/rudironsoni/Ghost.git
    targetRevision: HEAD
    path: infrastructure/automation/templates/helm-chart

    helm:
      releaseName: ghost-cms

      # Values files from repository
      valueFiles:
        - ../../environments/production/values.yaml

      # Runtime parameter overrides
      parameters:
        - name: image.repository
          value: "ghcr.io/rudironsoni/ghost"
        - name: image.tag
          value: "latest"
        - name: replicaCount
          value: "3"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "10"
        - name: ingress.enabled
          value: "true"
        - name: ingress.className
          value: "nginx"
        - name: ingress.hosts[0].host
          value: "ghost.example.com"
        - name: ingress.tls[0].secretName
          value: "ghost-tls"

      # Helm-specific options
      valuesObject:
        global:
          environment: production
          region: us-east-1

        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 1000m
            memory: 2Gi

        persistence:
          enabled: true
          storageClass: "gp3-encrypted"
          size: 100Gi
          accessMode: ReadWriteOnce

        mysql:
          enabled: true
          auth:
            existingSecret: ghost-mysql-secret
          primary:
            persistence:
              enabled: true
              size: 100Gi
              storageClass: "gp3-encrypted"
          metrics:
            enabled: true

        redis:
          enabled: true
          auth:
            enabled: true
            existingSecret: ghost-redis-secret
          master:
            persistence:
              enabled: true
              size: 20Gi
          metrics:
            enabled: true

        monitoring:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
          prometheusRule:
            enabled: true

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault

        podSecurityContext:
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false

        networkPolicy:
          enabled: true
          policyTypes:
            - Ingress
            - Egress

  # Destination cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: ghost-production

  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

    managedNamespaceMetadata:
      labels:
        app: ghost
        environment: production
        managed-by: argocd
      annotations:
        argocd.argoproj.io/tracking-id: ghost-cms

  # Ignore differences for fields that change frequently
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas

  # Health assessment
  revisionHistoryLimit: 10

---
