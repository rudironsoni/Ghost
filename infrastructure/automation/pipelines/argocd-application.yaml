---
# ArgoCD AppProject for Production
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ghost-production
  namespace: argocd
  labels:
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Ghost CMS Production Environment

  sourceRepos:
    - https://github.com/rudironsoni/Ghost.git
    - https://charts.bitnami.com/bitnami

  destinations:
    - namespace: ghost-production
      server: https://kubernetes.default.svc
    - namespace: ghost-production-*
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: production-admin
      description: Full access to production applications
      policies:
        - p, proj:ghost-production:production-admin, applications, *, ghost-production/*, allow
      groups:
        - ghost-production-admins

    - name: production-readonly
      description: Read-only access to production applications
      policies:
        - p, proj:ghost-production:production-readonly, applications, get, ghost-production/*, allow
      groups:
        - ghost-production-viewers

  orphanedResources:
    warn: true
    ignore:
      - group: ''
        kind: ConfigMap
        name: kube-root-ca.crt

