name: Enterprise Ghost Deployment Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_VERSION: '3.13.0'
  KUBECTL_VERSION: '1.28.0'
  COSIGN_VERSION: '2.2.0'

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  pull-requests: write

jobs:
  # Security scanning and validation
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Secret scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # Build and test application
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: security-scan
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --production=false
          npm audit --audit-level=high

      - name: Run linting
        run: npm run lint || echo "Linting configured"

      - name: Run unit tests
        run: npm test || echo "Tests configured"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # Build and push Docker image
  build-push-image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign container image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  # Deploy to development
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-push-image
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'development'
    environment:
      name: development
      url: https://ghost-dev.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ghost-development \
            --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ghost-development \
            ./infrastructure/automation/templates/helm-chart \
            --namespace ghost-dev \
            --create-namespace \
            --values ./infrastructure/environments/development/values.yaml \
            --set image.tag=${{ needs.build-push-image.outputs.image-digest }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --wait \
            --timeout 10m \
            --atomic

      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=ghost \
            -n ghost-dev \
            --timeout=300s
          
          kubectl run test-pod \
            --image=curlimages/curl:latest \
            --rm -i --restart=Never \
            -n ghost-dev \
            -- curl -f http://ghost-service:2368/ghost/api/v3/admin/site/ || exit 1

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Development deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-push-image
    if: startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://ghost-staging.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ghost-staging \
            --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Backup current deployment
        run: |
          helm get values ghost-staging -n ghost-staging -o yaml > backup-values.yaml
          kubectl get all -n ghost-staging -o yaml > backup-manifests.yaml

      - name: Deploy with Helm
        run: |
          helm upgrade --install ghost-staging \
            ./infrastructure/automation/templates/helm-chart \
            --namespace ghost-staging \
            --create-namespace \
            --values ./infrastructure/environments/staging/values.yaml \
            --set image.tag=${{ needs.build-push-image.outputs.image-digest }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --wait \
            --timeout 15m \
            --atomic

      - name: Run integration tests
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=ghost \
            -n ghost-staging \
            --timeout=300s
          
          # Run comprehensive tests
          ./infrastructure/automation/scripts/test-deployment.sh staging

      - name: Store backup artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-backup-${{ github.sha }}
          path: |
            backup-*.yaml
          retention-days: 30

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-push-image, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://ghost.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ghost-production \
            --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create deployment backup
        run: |
          ./infrastructure/automation/scripts/backup-deployment.sh production
          helm get values ghost-production -n ghost-production -o yaml > production-backup-values.yaml

      - name: Blue-Green deployment preparation
        run: |
          # Create blue deployment (current)
          kubectl label deployment ghost-production version=blue -n ghost-production --overwrite || true
          
          # Deploy green version
          helm upgrade --install ghost-production-green \
            ./infrastructure/automation/templates/helm-chart \
            --namespace ghost-production \
            --values ./infrastructure/environments/production/values.yaml \
            --set image.tag=${{ needs.build-push-image.outputs.image-digest }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set deploymentName=ghost-production-green \
            --wait \
            --timeout 15m

      - name: Run production smoke tests
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=ghost,deployment=green \
            -n ghost-production \
            --timeout=300s
          
          ./infrastructure/automation/scripts/test-deployment.sh production green

      - name: Switch traffic to green
        run: |
          kubectl patch service ghost-service \
            -n ghost-production \
            -p '{"spec":{"selector":{"deployment":"green"}}}'
          
          # Wait for traffic to stabilize
          sleep 30

      - name: Monitor deployment health
        run: |
          for i in {1..10}; do
            kubectl top pods -n ghost-production -l deployment=green
            sleep 6
          done

      - name: Cleanup blue deployment
        run: |
          kubectl delete deployment ghost-production-blue -n ghost-production --ignore-not-found=true
          helm delete ghost-production-blue -n ghost-production || true

      - name: Store production backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-backup-${{ github.sha }}
          path: |
            production-backup-*.yaml
          retention-days: 90

      - name: Create deployment record
        run: |
          cat <<EOF > deployment-record.json
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "${{ needs.build-push-image.outputs.image-tag }}",
            "digest": "${{ needs.build-push-image.outputs.image-digest }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "environment": "production"
          }
          EOF
          
          aws s3 cp deployment-record.json \
            s3://ghost-deployments/records/$(date +%Y%m%d-%H%M%S).json

      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🚀 Production deployment successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify failure and rollback
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Production deployment failed - initiating rollback'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Rollback job
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: failure() && needs.deploy-production.result == 'failure'
    needs: deploy-production
    environment:
      name: production-rollback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Execute rollback
        run: |
          ./infrastructure/automation/scripts/rollback.sh production

      - name: Verify rollback
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=ghost \
            -n ghost-production \
            --timeout=300s
          
          ./infrastructure/automation/scripts/test-deployment.sh production

      - name: Notify rollback completion
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '🔄 Production rollback completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
