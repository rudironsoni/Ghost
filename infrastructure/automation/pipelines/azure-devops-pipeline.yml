# Enterprise Azure DevOps Pipeline for Ghost CMS
# Multi-stage pipeline with security scanning, testing, and blue-green deployment

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    exclude:
      - '**.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'development'
    values:
      - development
      - staging
      - production
  - name: deploymentStrategy
    displayName: 'Deployment Strategy'
    type: string
    default: 'bluegreen'
    values:
      - bluegreen
      - canary
      - rolling
  - name: runSecurityScan
    displayName: 'Run Security Scan'
    type: boolean
    default: true

variables:
  - name: dockerRegistryServiceConnection
    value: 'ghost-acr-connection'
  - name: imageRepository
    value: 'ghost/cms'
  - name: containerRegistry
    value: 'ghostregistry.azurecr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  - name: helmChartPath
    value: '$(Build.SourcesDirectory)/infrastructure/automation/templates/helm-chart'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: kubernetesServiceConnection
    value: 'ghost-k8s-connection'
  - name: namespace
    value: 'ghost-$(parameters.environment)'
  - group: ghost-secrets-$(parameters.environment)
  - group: ghost-config-$(parameters.environment)

stages:
  # ================================
  # Stage 1: Build and Security Scan
  # ================================
  - stage: BuildAndScan
    displayName: 'Build and Security Scan'
    jobs:
      - job: SecurityScan
        displayName: 'Security and Compliance Scan'
        condition: eq('${{ parameters.runSecurityScan }}', true)
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
              addToPath: true

          - task: UseNode@1
            inputs:
              version: '18.x'

          - script: |
              npm ci
              npm audit --audit-level=moderate
            displayName: 'NPM Audit'
            continueOnError: true

          - task: Bash@3
            displayName: 'Secret Scanning with TruffleHog'
            inputs:
              targetType: 'inline'
              script: |
                docker run --rm -v $(Build.SourcesDirectory):/repo \
                  trufflesecurity/trufflehog:latest \
                  filesystem /repo \
                  --only-verified \
                  --json > trufflehog-results.json
            continueOnError: true

          - task: AquaScanner@1
            displayName: 'Aqua Security Scan'
            inputs:
              image: '$(containerRegistry)/$(imageRepository):$(tag)'
              scanType: 'filesystem'
              path: '$(Build.SourcesDirectory)'
              hideBase: false
              continueOnError: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Security Reports'
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/*.json'
              ArtifactName: 'security-reports'
              publishLocation: 'Container'

      - job: BuildTest
        displayName: 'Build and Test Application'
        dependsOn: SecurityScan
        condition: succeededOrFailed()
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UseNode@1
            inputs:
              version: '18.x'

          - task: Cache@2
            displayName: 'Cache NPM dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - script: |
              npm ci
            displayName: 'Install dependencies'

          - script: |
              npm run lint || echo "Linting step completed"
            displayName: 'Run linting'
            continueOnError: true

          - script: |
              npm test -- --coverage || echo "Test step completed"
            displayName: 'Run unit tests'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              failTaskOnFailedTests: false

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Build.SourcesDirectory)/coverage/cobertura-coverage.xml'

      - job: BuildPushImage
        displayName: 'Build and Push Container Image'
        dependsOn: BuildTest
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Login to Azure Container Registry'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: 'Build container image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest
              arguments: |
                --build-arg BUILD_DATE=$(Build.Repository.Uri)
                --build-arg VCS_REF=$(Build.SourceVersion)
                --build-arg VERSION=$(tag)
                --label "org.opencontainers.image.created=$(Build.Repository.Uri)"
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)"

          - task: AquaScanner@1
            displayName: 'Scan Docker Image'
            inputs:
              image: '$(containerRegistry)/$(imageRepository):$(tag)'
              scanType: 'image'
              registry: '$(containerRegistry)'
              continueOnError: false

          - task: Docker@2
            displayName: 'Push image to registry'
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

          - task: Bash@3
            displayName: 'Generate SBOM'
            inputs:
              targetType: 'inline'
              script: |
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                  anchore/syft:latest \
                  $(containerRegistry)/$(imageRepository):$(tag) \
                  -o spdx-json > sbom.spdx.json

          - task: PublishBuildArtifacts@1
            displayName: 'Publish SBOM'
            inputs:
              PathtoPublish: 'sbom.spdx.json'
              ArtifactName: 'sbom'
              publishLocation: 'Container'

  # ================================
  # Stage 2: Deploy to Development
  # ================================
  - stage: DeployDevelopment
    displayName: 'Deploy to Development'
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq('${{ parameters.environment }}', 'development')))
    dependsOn: BuildAndScan
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to Development Environment'
        environment: 'ghost-development'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: '3.13.0'

                - task: Kubernetes@1
                  displayName: 'kubectl login'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: '$(kubernetesServiceConnection)-dev'
                    command: 'login'

                - task: HelmDeploy@0
                  displayName: 'Deploy with Helm'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)-dev'
                    namespace: '$(namespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(helmChartPath)'
                    releaseName: 'ghost-dev'
                    overrideValues: |
                      image.repository=$(containerRegistry)/$(imageRepository)
                      image.tag=$(tag)
                      environment=development
                    valueFile: '$(Build.SourcesDirectory)/infrastructure/environments/development/values.yaml'
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 10m --atomic'

                - task: Bash@3
                  displayName: 'Run smoke tests'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl wait --for=condition=ready pod \
                        -l app=ghost \
                        -n $(namespace) \
                        --timeout=300s

                      kubectl run test-pod \
                        --image=curlimages/curl:latest \
                        --rm -i --restart=Never \
                        -n $(namespace) \
                        -- curl -f http://ghost-service:2368/ghost/api/v3/admin/site/ || exit 1

  # ================================
  # Stage 3: Deploy to Staging
  # ================================
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'release'), eq('${{ parameters.environment }}', 'staging')))
    dependsOn: BuildAndScan
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to Staging Environment'
        environment: 'ghost-staging'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: '3.13.0'

                - task: Kubernetes@1
                  displayName: 'kubectl login'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: '$(kubernetesServiceConnection)-staging'
                    command: 'login'

                - task: Bash@3
                  displayName: 'Backup current deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      helm get values ghost-staging -n $(namespace) -o yaml > backup-values.yaml || true
                      kubectl get all -n $(namespace) -o yaml > backup-manifests.yaml || true

                - task: HelmDeploy@0
                  displayName: 'Deploy with Helm'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)-staging'
                    namespace: '$(namespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(helmChartPath)'
                    releaseName: 'ghost-staging'
                    overrideValues: |
                      image.repository=$(containerRegistry)/$(imageRepository)
                      image.tag=$(tag)
                      environment=staging
                    valueFile: '$(Build.SourcesDirectory)/infrastructure/environments/staging/values.yaml'
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 15m --atomic'

                - task: Bash@3
                  displayName: 'Run integration tests'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl wait --for=condition=ready pod \
                        -l app=ghost \
                        -n $(namespace) \
                        --timeout=300s

                      $(Build.SourcesDirectory)/infrastructure/automation/scripts/test-deployment.sh staging

                - task: PublishBuildArtifacts@1
                  displayName: 'Publish backup artifacts'
                  condition: always()
                  inputs:
                    PathtoPublish: 'backup-*.yaml'
                    ArtifactName: 'staging-backup-$(Build.BuildId)'
                    publishLocation: 'Container'

  # ================================
  # Stage 4: Deploy to Production
  # ================================
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.environment }}', 'production')))
    dependsOn:
      - BuildAndScan
      - DeployStaging
    jobs:
      - deployment: DeployProd
        displayName: 'Deploy to Production Environment'
        environment: 'ghost-production'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: '3.13.0'

                - task: Kubernetes@1
                  displayName: 'kubectl login'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: '$(kubernetesServiceConnection)-prod'
                    command: 'login'

                - task: Bash@3
                  displayName: 'Create production backup'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $(Build.SourcesDirectory)/infrastructure/automation/scripts/backup-deployment.sh production
                      helm get values ghost-production -n $(namespace) -o yaml > production-backup-values.yaml || true

                - task: Bash@3
                  displayName: 'Blue-Green Deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      # Label current deployment as blue
                      kubectl label deployment ghost-production version=blue -n $(namespace) --overwrite || true

                      # Deploy green version
                      helm upgrade --install ghost-production-green \
                        $(helmChartPath) \
                        --namespace $(namespace) \
                        --values $(Build.SourcesDirectory)/infrastructure/environments/production/values.yaml \
                        --set image.repository=$(containerRegistry)/$(imageRepository) \
                        --set image.tag=$(tag) \
                        --set deploymentName=ghost-production-green \
                        --wait \
                        --timeout 15m

                - task: Bash@3
                  displayName: 'Run production smoke tests'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl wait --for=condition=ready pod \
                        -l app=ghost,deployment=green \
                        -n $(namespace) \
                        --timeout=300s

                      $(Build.SourcesDirectory)/infrastructure/automation/scripts/test-deployment.sh production green

                - task: Bash@3
                  displayName: 'Switch traffic to green'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl patch service ghost-service \
                        -n $(namespace) \
                        -p '{"spec":{"selector":{"deployment":"green"}}}'

                      # Monitor for 60 seconds
                      sleep 60

                - task: Bash@3
                  displayName: 'Monitor deployment health'
                  inputs:
                    targetType: 'inline'
                    script: |
                      for i in {1..10}; do
                        kubectl top pods -n $(namespace) -l deployment=green || true
                        sleep 6
                      done

                - task: Bash@3
                  displayName: 'Cleanup blue deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl delete deployment ghost-production-blue -n $(namespace) --ignore-not-found=true
                      helm delete ghost-production-blue -n $(namespace) || true

                - task: PublishBuildArtifacts@1
                  displayName: 'Publish production backup'
                  condition: always()
                  inputs:
                    PathtoPublish: 'production-backup-*.yaml'
                    ArtifactName: 'production-backup-$(Build.BuildId)'
                    publishLocation: 'Container'

                - task: Bash@3
                  displayName: 'Create deployment record'
                  inputs:
                    targetType: 'inline'
                    script: |
                      cat <<EOF > deployment-record.json
                      {
                        "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                        "version": "$(tag)",
                        "commit": "$(Build.SourceVersion)",
                        "buildId": "$(Build.BuildId)",
                        "actor": "$(Build.RequestedFor)",
                        "environment": "production"
                      }
                      EOF

                      az storage blob upload \
                        --account-name ghoststorage \
                        --container-name deployments \
                        --name records/$(date +%Y%m%d-%H%M%S).json \
                        --file deployment-record.json

            on:
              failure:
                steps:
                  - task: Bash@3
                    displayName: 'Execute automatic rollback'
                    inputs:
                      targetType: 'inline'
                      script: |
                        $(Build.SourcesDirectory)/infrastructure/automation/scripts/rollback.sh production

                  - task: Bash@3
                    displayName: 'Verify rollback'
                    inputs:
                      targetType: 'inline'
                      script: |
                        kubectl wait --for=condition=ready pod \
                          -l app=ghost \
                          -n $(namespace) \
                          --timeout=300s

                        $(Build.SourcesDirectory)/infrastructure/automation/scripts/test-deployment.sh production

  # ================================
  # Stage 5: Post-Deployment Tasks
  # ================================
  - stage: PostDeployment
    displayName: 'Post-Deployment Tasks'
    dependsOn: DeployProduction
    condition: succeeded()
    jobs:
      - job: Notifications
        displayName: 'Send notifications'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Bash@3
            displayName: 'Send Slack notification'
            inputs:
              targetType: 'inline'
              script: |
                curl -X POST $(SLACK_WEBHOOK_URL) \
                  -H 'Content-Type: application/json' \
                  -d '{
                    "text": "🚀 Ghost CMS deployed to production successfully",
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*Deployment Successful*\n*Environment:* Production\n*Version:* $(tag)\n*Commit:* $(Build.SourceVersion)"
                        }
                      }
                    ]
                  }'

          - task: Bash@3
            displayName: 'Update deployment dashboard'
            inputs:
              targetType: 'inline'
              script: |
                echo "Update monitoring dashboard with new deployment version"
                # Add custom dashboard update logic here
